<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
{{#if page.canonical}}<link rel="canonical" href="{{page.canonical}}">
<meta property="og:url" content="{{page.canonical}}">{{/if}}
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{brand.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta name="theme-color" content="#111214">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="48x48 32x32 16x16">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
{{#if site.url}}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"{{brand.name}}","url":"{{site.url}}"}</script>{{/if}}
</head>
<body class="{{page.bodyClass}}" data-form-provider="{{forms.provider}}" data-form-endpoint="{{forms.endpoint}}" data-contact-email="{{contact.email}}" data-response-time="{{contact.responseTime}}">
<a class="skip-link" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{content}}
</main>
{{> footer}}
<script src="/assets/main.js" defer></script>
{{{page.scripts}}}
</body>
</html>
