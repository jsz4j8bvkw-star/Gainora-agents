<script>
// Gainora — AI for Business course content
const COURSE = {
  title: "AI for Business: put AI to work",
  version: "1.0 (pilot) · November 2026",
};

const MODULES = [
{
id: "m1",
title: "What AI really is (and isn't)",
time: "35 min",
goal: "Understand how today's AI tools work, what they're good at and where they go wrong, so you can use them with confidence instead of guesswork.",
lessons: [
{ title: "AI in plain English", html: `
<p>When people say "AI" in business today, they usually mean <strong>generative AI</strong>: tools that produce text, images, audio or code when you ask them in ordinary language. The best-known are chat assistants such as ChatGPT, Claude, Gemini and Microsoft Copilot, but the same technology now sits inside tools you may already use: your email, your documents, your accounting or CRM software.</p>
<p>Underneath most of these tools is a <strong>large language model</strong> (LLM). It has been trained on a vast amount of text to predict, word by word, what a useful response looks like. That simple idea produces something surprisingly capable: it can draft, summarise, rewrite, translate, classify, extract and reason through problems.</p>
<p>Three things to hold on to:</p>
<ul>
<li><strong>It predicts, it doesn't "know".</strong> It produces the most plausible answer, which is usually right for common tasks and can be confidently wrong for specific facts.</li>
<li><strong>It works from what you give it.</strong> Context you provide (your notes, your policies, the customer's email) matters more than anything it "remembers" from training.</li>
<li><strong>It's a tool, not a colleague.</strong> It doesn't understand your business, your customers or the consequences of a mistake unless you tell it, and you remain responsible for what it produces.</li>
</ul>`},
{ title: "What AI is good at today", html: `
<p>For a small business, AI earns its keep in five broad jobs:</p>
<ol>
<li><strong>First drafts.</strong> Emails, proposals, job adverts, product descriptions, social posts, policies. You edit; it saves you the blank page.</li>
<li><strong>Summaries.</strong> Long documents, meeting notes, customer feedback, contracts (for understanding, not legal advice).</li>
<li><strong>Rewriting and tone.</strong> Make this friendlier, shorter, clearer, more formal, suitable for a customer who's upset.</li>
<li><strong>Sorting and extracting.</strong> Pull names, dates and amounts out of messages; tag enquiries by type; turn messy notes into a table.</li>
<li><strong>Thinking partner.</strong> Brainstorm options, spot gaps in a plan, prepare questions before a meeting, role-play a difficult conversation.</li>
</ol>
<p>Notice the pattern: AI is strongest where <em>a human checks the result</em> and where a good-enough first version saves real time.</p>`},
{ title: "Where it goes wrong", html: `
<p>Every business user needs to know the main failure modes:</p>
<ul>
<li><strong>Hallucination.</strong> The tool states something false with confidence: a made-up statistic, a law that doesn't exist, a wrong price, an invented quote. <em>Rule: never publish a fact, figure, name or legal statement from AI without checking it against a source you trust.</em></li>
<li><strong>Out-of-date knowledge.</strong> Models are trained up to a cut-off date. Some tools can search the web, but they can still pick weak sources.</li>
<li><strong>Bland, generic output.</strong> Without your context, AI writes like everyone else. Your customers will notice.</li>
<li><strong>Agreeing too easily.</strong> Ask "is this a good idea?" and it may simply agree. Ask it to argue against you instead.</li>
<li><strong>Maths and counting.</strong> Better than it was, but still check any numbers, especially in pricing, invoices and tax.</li>
<li><strong>Bias.</strong> Outputs can reflect bias in training data. Take extra care with anything affecting people: hiring, credit, pricing, complaints.</li>
</ul>
<div class="callout"><strong>The golden rule:</strong> AI drafts, a human decides. The more a mistake would cost, the more carefully a person checks.</div>`},
{ title: "Assistants, automations and agents", html: `
<p>You'll hear three terms. They're different levels of the same idea:</p>
<table class="t"><tr><th>Type</th><th>What it does</th><th>Example</th></tr>
<tr><td><strong>Assistant</strong></td><td>You ask, it answers. Nothing happens unless you act on it.</td><td>"Draft a reply to this complaint."</td></tr>
<tr><td><strong>Automation</strong></td><td>A fixed workflow runs on a trigger, sometimes with an AI step inside.</td><td>New website enquiry → AI summarises and tags it → added to your tracker → you get a notification.</td></tr>
<tr><td><strong>Agent</strong></td><td>AI decides some of the steps itself to reach a goal, using tools you allow.</td><td>"Research these five competitors and draft a comparison."</td></tr>
</table>
<p>Most small businesses get the best return from <strong>assistants first, then simple automations</strong>. Agents are powerful but need clear limits, because the more freedom a tool has, the more ways it can go wrong. We cover all three in Module 9.</p>`}
],
exercise: { title: "Your starting point", intro: "Be honest. This becomes the first part of your AI plan.", fields: [
 { id: "m1_using", label: "Which AI tools do you (or your team) use today, and for what?", type: "textarea" },
 { id: "m1_worry", label: "What's your biggest worry or doubt about using AI in your business?", type: "textarea" },
 { id: "m1_hope", label: "If AI saved you five hours a week, what would you do with that time?", type: "textarea" }
]},
templates: [
 { title: "Fact-check prompt", text: "Review the text below. List every factual claim, number, name, date or legal statement it contains. For each one, say whether it needs checking against an outside source, and what kind of source would confirm it. Don't correct anything yet.\n\n[PASTE TEXT]" },
 { title: "Devil's advocate prompt", text: "I'm considering the plan below. Don't tell me it's good. Give me the five strongest reasons it could fail, the questions a sceptical customer or investor would ask, and what I'd need to know to answer them.\n\n[DESCRIBE PLAN]" }
],
quiz: [
 { q: "A chat assistant gives you a statistic for a blog post. What should you do?", options: ["Publish it. AI is trained on huge amounts of data", "Check it against a trusted source before using it", "Ask the AI if it's sure, then publish"], a: 1, why: "AI can state false figures confidently. Asking it if it's sure isn't a check; only a trusted outside source is." },
 { q: "Which job is AI generally strongest at for a small business?", options: ["Making final decisions about customers", "Producing first drafts a person then edits", "Calculating VAT returns unsupervised"], a: 1, why: "AI saves most time where a human reviews the output. Decisions and tax figures need human responsibility." },
 { q: "What's the difference between an automation and an agent?", options: ["There's no difference", "An automation follows fixed steps; an agent decides some steps itself", "Agents can only answer questions"], a: 1, why: "Automations run a fixed workflow. Agents choose steps towards a goal, which is more flexible and needs tighter limits." }
]
},

{
id: "m2",
title: "Choosing the right tools",
time: "30 min",
goal: "Pick a small, sensible set of AI tools for your business without wasting money or putting data at risk.",
lessons: [
{ title: "The four types of tool", html: `
<ol>
<li><strong>General chat assistants</strong> (ChatGPT, Claude, Gemini, Copilot and others). The most flexible. Good for drafting, summarising, research and thinking.</li>
<li><strong>AI built into tools you already use.</strong> Email, office suites, CRMs, website builders, accounting and design tools increasingly include AI features. The advantage: it works where your data already is.</li>
<li><strong>Automation platforms</strong> (for example Zapier, Make or Microsoft Power Automate). Connect your apps and add AI steps to workflows.</li>
<li><strong>Specialist tools.</strong> Transcription, image generation, video, customer-service chatbots, bookkeeping assistants. Useful for one job done well.</li>
</ol>
<p>Start with <strong>one general assistant</strong> and the AI already inside your main business software. Add more only when you have a clear job for it.</p>`},
{ title: "How to compare tools (the checklist)", html: `
<p>Features change every month, so learn to judge tools instead of memorising them. Ask these eight questions:</p>
<ol>
<li><strong>Job:</strong> what exact task will this do for us, and how often?</li>
<li><strong>Quality:</strong> test it on three real examples from your business. Is the output usable with light editing?</li>
<li><strong>Data:</strong> does the provider use your inputs to train its models? Can you switch that off? Business plans often offer stronger protection, so check the current terms.</li>
<li><strong>Location and security:</strong> where is data stored? Does it support two-factor login and admin controls?</li>
<li><strong>Integration:</strong> does it connect to the tools you already use?</li>
<li><strong>Cost:</strong> monthly price per person, usage limits, and the cost of the time it saves. Avoid annual contracts until you've proven value.</li>
<li><strong>Team fit:</strong> will your team actually use it? Simple beats powerful.</li>
<li><strong>Exit:</strong> can you export your data and leave easily?</li>
</ol>`},
{ title: "Free vs paid", html: `
<p>Free plans are fine for learning and for non-sensitive tasks. For business use, a paid business or team plan is usually worth it because it often brings stronger data protections, admin controls, higher limits and better models. Always read the provider's current data and privacy terms for the plan you choose, since these differ between consumer and business plans and change over time.</p>
<p>A sensible starter budget for a small team is one paid assistant per regular user, plus any AI included in software you already pay for. Review it after 90 days: keep what's used, cancel what isn't.</p>`}
],
exercise: { title: "Your tool shortlist", intro: "Pick your starting stack. Fewer is better.", fields: [
 { id: "m2_assistant", label: "Which general AI assistant will you standardise on, and who needs a licence?", type: "textarea" },
 { id: "m2_existing", label: "Which tools you already pay for have AI features you could switch on or test?", type: "textarea" },
 { id: "m2_budget", label: "Monthly budget you're willing to test for 90 days (£)", type: "text" }
]},
templates: [
 { title: "Tool evaluation scorecard", text: "TOOL: ______________________  Tested by: ________  Date: ________\n\nScore each 1 (poor) to 5 (excellent):\n[ ] Does the specific job we need\n[ ] Output quality on 3 real examples\n[ ] Data protection (no training on our data / business terms)\n[ ] Security (2FA, admin controls)\n[ ] Works with our existing tools\n[ ] Cost vs time saved\n[ ] Easy for the team to use\n[ ] Easy to export data and leave\n\nTotal: ___ / 40\nDecision:  Adopt / Trial 30 days / Reject\nNotes:" }
],
quiz: [
 { q: "What's the best first step when choosing an AI tool?", options: ["Buy the most popular one on an annual plan", "Test it on three real examples of a specific job", "Sign up for every free trial available"], a: 1, why: "Real examples from your own business are the only reliable test of usefulness." },
 { q: "Why might a business plan be worth paying for?", options: ["It always produces perfect answers", "It often brings stronger data protection and admin controls", "It removes the need to check outputs"], a: 1, why: "The main business difference is usually data handling and control, but always check the current terms." },
 { q: "How many AI tools should a small business start with?", options: ["As many as possible", "One general assistant plus AI in existing software", "None until AI is regulated"], a: 1, why: "Start small, prove value, then add tools for specific jobs." }
]
},

{
id: "m3",
title: "Prompting that actually works",
time: "45 min",
goal: "Write instructions that get useful, on-brand results the first or second time, and build a library of prompts your whole team can reuse.",
lessons: [
{ title: "The five-part prompt", html: `
<p>Most poor AI output comes from vague instructions. Use this structure (remember it as <strong>R-C-T-F-E</strong>):</p>
<ol>
<li><strong>Role:</strong> who should it act as? "You're an experienced customer-service manager for a UK plumbing company."</li>
<li><strong>Context:</strong> what does it need to know? Your business, the customer, the situation, your tone, what's already happened.</li>
<li><strong>Task:</strong> exactly what you want. "Draft a reply that apologises for the late visit and offers two new time slots."</li>
<li><strong>Format:</strong> length, structure, style. "Under 120 words, friendly, UK English, no bullet points, sign off as Sam."</li>
<li><strong>Examples:</strong> show what good looks like. Paste a previous email you liked.</li>
</ol>
<div class="callout"><strong>Weak:</strong> "Write a reply to this complaint."<br><strong>Strong:</strong> "You're the owner of a small UK bakery. A customer says their birthday cake arrived late (email below). Write a reply that apologises without making excuses, explains we've changed our delivery check, and offers a full refund or a free cake next time. Warm, personal, under 120 words, UK spelling. Sign off as Priya."</div>`},
{ title: "Iterate, don't restart", html: `
<p>Treat the first answer as a draft and give feedback like you would to a new team member:</p>
<ul>
<li>"Shorter, and lose the corporate phrases."</li>
<li>"Good, but the second paragraph promises something we can't do. Remove it."</li>
<li>"Give me three different versions: formal, friendly and very brief."</li>
<li>"What information would make this better? Ask me questions first."</li>
</ul>
<p>The last one is powerful: asking the AI to <strong>interview you first</strong> often produces far better results for complex documents like proposals or policies.</p>`},
{ title: "Give it your voice", html: `
<p>Generic AI writing sounds like everyone else. Fix that once by creating a <strong>brand voice brief</strong> you paste in (or save in your tool's custom instructions or project settings):</p>
<ul>
<li>Who you are, who you serve, where.</li>
<li>Three words for your tone (for example: warm, direct, practical).</li>
<li>Words and phrases you use, and ones you never use.</li>
<li>Two or three examples of your best real writing.</li>
<li>Rules: UK spelling, no exclamation marks, no claims you can't prove.</li>
</ul>
<p>Most assistants now let you save standing instructions or project files so you don't paste this every time. Use that feature.</p>`},
{ title: "Build a team prompt library", html: `
<p>When a prompt works, save it. A shared document or note with your best prompts turns individual tricks into a team capability. For each prompt, record: what it's for, the prompt itself with [PLACEHOLDERS], and an example of good output.</p>
<p>Good candidates: enquiry replies, quote follow-ups, review responses, social posts, meeting summaries, job adverts, supplier emails, policy drafts.</p>`}
],
exercise: { title: "Write your brand voice brief", intro: "This becomes a reusable asset. You'll paste it into AI tools from now on.", fields: [
 { id: "m3_who", label: "Who you are, what you sell, who your customers are, where you operate", type: "textarea" },
 { id: "m3_tone", label: "Three words for your tone, plus words you'd never use", type: "textarea" },
 { id: "m3_prompt", label: "Rewrite one task you do every week as a full R-C-T-F-E prompt", type: "textarea" }
]},
templates: [
 { title: "Brand voice brief", text: "BRAND VOICE BRIEF: [BUSINESS NAME]\n\nWho we are: [one sentence]\nWho we serve: [customers, location]\nTone: [3 words]. We sound like [a knowledgeable friend / a trusted expert / ...].\nWe always: use UK spelling; write short sentences; [your rules]\nWe never: use hype ('game-changing', 'unlock'); make promises we can't prove; [your rules]\nPhrases we like: [...]\nExamples of our writing:\n1. [paste]\n2. [paste]\n\nUse this voice for everything you write for us." },
 { title: "Interview-me-first prompt", text: "I need to create [DOCUMENT, e.g. a proposal for a new client]. Before you write anything, ask me up to 8 questions, one at a time, to get the information you need. After my last answer, write the first draft." },
 { title: "Three versions prompt", text: "Write three versions of [WHAT]: (1) formal and concise, (2) warm and friendly, (3) very short (under 40 words). Same facts in each. UK English.\n\nDetails: [PASTE]" }
],
quiz: [
 { q: "Which part of a prompt most improves quality for business tasks?", options: ["Saying please", "Giving relevant context about your business and situation", "Using capital letters"], a: 1, why: "Context is what turns generic output into something specific to your business." },
 { q: "The first draft isn't right. What's usually best?", options: ["Start a new chat from scratch", "Give specific feedback and ask for a revision", "Give up and write it yourself"], a: 1, why: "Iterating with clear feedback is faster and keeps the useful parts." },
 { q: "What's a brand voice brief for?", options: ["Making AI output sound like your business", "Registering a trade mark", "Training a new AI model"], a: 0, why: "It gives AI your tone, rules and examples so drafts sound like you." }
]
},

{
id: "m4",
title: "Using AI safely and legally",
time: "45 min",
goal: "Protect your customers, your business and your reputation: know what you can share, the UK rules that apply, and how to write a simple AI policy.",
lessons: [
{ title: "What never goes into an AI tool", html: `
<p>Treat anything you type or upload as if it could be seen by the provider. Unless you've checked your plan's terms and settings, <strong>don't paste</strong>:</p>
<ul>
<li>Passwords, API keys, bank or card details.</li>
<li>Customer or staff personal data you don't need for the task (names, addresses, health information, ID numbers).</li>
<li>Special category data (health, religion, ethnicity, sexual orientation and similar). Avoid this entirely.</li>
<li>Confidential information covered by a contract or NDA.</li>
<li>Unreleased financial results or commercially sensitive plans.</li>
</ul>
<p><strong>Practical habit:</strong> remove or replace names before pasting ("Customer A", "[ADDRESS]"). You rarely need the real details to get a good draft.</p>`},
{ title: "The UK rules in plain words", html: `
<p>There is no single "UK AI Act". Instead, existing laws apply to how you use AI. This is general information, not legal advice:</p>
<ul>
<li><strong>UK GDPR and the Data Protection Act 2018</strong> apply whenever you use personal data, including in AI tools. You need a lawful reason, you must be transparent (update your privacy notice if AI processes customer data), keep data secure and only use what you need.</li>
<li><strong>The Data (Use and Access) Act 2025</strong> changed the rules on automated decisions from February 2026. Decisions with significant effects on people made by computer alone are allowed only with safeguards: people must be told, be able to challenge the decision and get meaningful human review. A person rubber-stamping the AI's output doesn't count.</li>
<li><strong>The ICO</strong> (now the Information Commission) is the UK regulator and publishes practical guidance on AI and data protection. It's the best free starting point.</li>
<li><strong>Consumer and advertising law</strong> still applies: AI-written claims must be true and not misleading, and fake reviews are illegal.</li>
<li><strong>Copyright:</strong> don't ask AI to copy other people's work, and check outputs you publish don't reproduce someone else's text or images.</li>
<li><strong>Your sector's regulator</strong> (for example the FCA, SRA or CQC) may have extra rules.</li>
</ul>`},
{ title: "If you sell to the EU", html: `
<p>The <strong>EU AI Act</strong> can apply to UK businesses whose AI systems are used in the EU. For most small businesses using everyday AI tools, the key points are:</p>
<ul>
<li><strong>AI literacy:</strong> since February 2025, organisations using AI should make sure their people understand it well enough to use it responsibly. Courses like this one help.</li>
<li><strong>Transparency:</strong> from August 2026, people should be told when they're interacting with an AI system such as a chatbot, and AI-generated "deepfake" content must be disclosed.</li>
<li><strong>High-risk uses</strong> (such as AI used in hiring decisions or credit scoring) carry heavy obligations, now phased in from late 2027. Avoid using AI to make these decisions without specialist advice.</li>
</ul>
<p>Rules and dates in this area change often. Check the current position or take advice before relying on them.</p>`},
{ title: "Your AI policy (one page is enough)", html: `
<p>Every business using AI, even a team of two, benefits from a short written policy. It protects you and gives staff confidence. Cover:</p>
<ol>
<li>Approved tools and who can use them.</li>
<li>What data may and may not be entered.</li>
<li>Human review: what must be checked before it's sent or published.</li>
<li>Disclosure: when you tell customers AI was involved (for example, chatbots).</li>
<li>Who to ask, and how to report a mistake.</li>
</ol>
<p>A ready-to-edit template is in this module's templates.</p>`}
],
exercise: { title: "Your safety rules", intro: "Decide your rules now, before something goes wrong.", fields: [
 { id: "m4_nogo", label: "List the types of information in your business that must never go into an AI tool", type: "textarea" },
 { id: "m4_review", label: "What must always be checked by a person before it's sent or published?", type: "textarea" },
 { id: "m4_owner", label: "Who in your business is responsible for AI use and questions?", type: "text" }
]},
templates: [
 { title: "One-page AI use policy", text: "AI USE POLICY: [BUSINESS NAME]   Version 1, [DATE]   Owner: [NAME]\n\n1. Purpose\nWe use AI tools to save time and improve our work. People stay responsible for everything we send, publish or decide.\n\n2. Approved tools\n[List tools and plans]. Don't use other AI tools for work without asking [OWNER].\n\n3. Information rules\nNever enter: passwords, payment details, special category data (health etc.), confidential client information, [other].\nRemove or replace names and personal details wherever possible.\n\n4. Human review\nBefore anything AI-assisted is sent or published, a person checks: facts and figures, names, prices, promises, tone, and that it doesn't copy others' work.\nAI never makes final decisions about customers, staff, pricing or complaints.\n\n5. Transparency\nWe tell customers when they're talking to an automated assistant. We update our privacy notice if AI processes customer data.\n\n6. Mistakes\nIf AI output causes or nearly causes a problem, tell [OWNER] the same day. We learn, we don't blame.\n\n7. Review\nWe review this policy every 6 months." },
 { title: "Anonymise-before-pasting prompt", text: "Rewrite the text below replacing every person's name with a role (Customer A, Staff member B), every address, phone number and email with [REMOVED], and any account or order numbers with [REF]. Keep everything else exactly the same.\n\n[PASTE TEXT]\n\n(Tip: do this step in a tool you've approved for personal data, or by hand.)" }
],
quiz: [
 { q: "Is there a single UK AI Act that small businesses must follow?", options: ["Yes, since 2024", "No. Existing laws like UK GDPR apply to AI use", "Only for companies over 250 staff"], a: 1, why: "The UK regulates AI through existing law, especially data protection, consumer law and sector regulators." },
 { q: "A good habit before pasting a customer email into AI is to…", options: ["Remove or replace personal details you don't need", "Add the customer's phone number for context", "Paste their payment details so it can process a refund"], a: 0, why: "Data minimisation: you rarely need real personal details to get a good draft." },
 { q: "Under the automated decisions rules, what counts as meaningful human involvement?", options: ["A person who clicks 'approve' on every AI decision", "A person who genuinely reviews and can change the outcome", "Telling customers AI was used"], a: 1, why: "Rubber-stamping isn't enough; the review must be real and able to change the outcome." }
]
},

{
id: "m5",
title: "Finding the best opportunities in your business",
time: "40 min",
goal: "Audit where your time goes and choose the three AI improvements that will make the biggest difference, safely.",
lessons: [
{ title: "Start with problems, not tools", html: `
<p>The most common mistake is starting with "what can I do with AI?". Start instead with "where do we lose time, money or customers?". AI is only worth it where it fixes a real problem.</p>
<p>Look for work that is:</p>
<ul>
<li><strong>Repetitive:</strong> the same type of task, many times a week.</li>
<li><strong>Text-heavy:</strong> writing, reading, summarising, sorting.</li>
<li><strong>Rule-based:</strong> clear steps a new starter could follow.</li>
<li><strong>Slow to start:</strong> tasks people put off because of the blank page.</li>
<li><strong>Causing leaks:</strong> slow replies, forgotten follow-ups, missed reviews.</li>
</ul>`},
{ title: "The task audit", html: `
<p>For one normal week, list the tasks you and your team repeat. For each, note:</p>
<ul>
<li><strong>Time per week</strong> (hours)</li>
<li><strong>Frequency</strong> (daily, weekly, monthly)</li>
<li><strong>AI fit</strong> (1–5): how well does it match the "good at" list in Module 1?</li>
<li><strong>Risk</strong> (1–5): what happens if it goes wrong? Customer harm, money, reputation.</li>
<li><strong>Value</strong> (1–5): would doing it faster or better win customers or save money?</li>
</ul>
<p>The worksheet in this module calculates a simple <strong>priority score = time × fit × value ÷ risk</strong>. Your top three become your first projects.</p>`},
{ title: "Quick wins vs bigger projects", html: `
<p>Sort your list into:</p>
<ul>
<li><strong>Quick wins (this week):</strong> one person, one assistant, a saved prompt. For example, replying to enquiries, writing social posts, summarising calls.</li>
<li><strong>Process improvements (this month):</strong> change how a task is done, possibly with templates and a simple automation. For example, an enquiry tracker with AI summaries.</li>
<li><strong>Bigger projects (this quarter):</strong> connecting systems, customer-facing chatbots, AI in reporting. Plan these carefully, with a trial and clear measures.</li>
</ul>
<div class="callout">Measure before you change anything. Note how long a task takes today. Without a "before", you can't prove the "after".</div>`}
],
exercise: { title: "Your task audit", intro: "Use the calculator below. Add at least five tasks.", fields: [], audit: true },
templates: [
 { title: "Task audit prompt", text: "I run a [TYPE OF BUSINESS] with [NUMBER] staff. Here's a list of tasks we repeat each week with rough hours:\n[LIST]\n\nFor each task, suggest (a) whether AI could help, (b) how, in one sentence, (c) the main risk, and (d) whether it's a quick win, process improvement or bigger project. Be realistic. Say 'not a good fit' where that's true." }
],
quiz: [
 { q: "Where should you start when looking for AI opportunities?", options: ["The newest AI tool", "Where the business loses time, money or customers", "Whatever competitors are doing"], a: 1, why: "Start with real problems; tools come second." },
 { q: "Why measure a task before introducing AI?", options: ["It's a legal requirement", "So you can prove whether the change saved time or improved results", "AI needs the number to work"], a: 1, why: "A 'before' measure lets you prove value and decide what to keep." },
 { q: "A task with high risk and low AI fit should be…", options: ["Your first AI project", "Low on the list, or kept manual", "Fully automated"], a: 1, why: "Start where fit and value are high and risk is low." }
]
},

{
id: "m6",
title: "Marketing and content",
time: "45 min",
goal: "Use AI to plan, draft and repurpose marketing content that sounds like you and stays truthful.",
lessons: [
{ title: "A simple content system", html: `
<p>AI makes it easy to produce lots of content. That's a trap: more average content doesn't win customers. Use AI to produce <em>better</em> content more consistently:</p>
<ol>
<li><strong>Plan</strong> a month of topics from real customer questions (ask AI to turn your FAQs and enquiries into topic ideas).</li>
<li><strong>Draft</strong> with your brand voice brief from Module 3.</li>
<li><strong>Add the human part:</strong> a real story, a photo, a local detail, your opinion. This is what makes it worth reading.</li>
<li><strong>Repurpose:</strong> one long piece becomes a blog, three social posts, an email and a short video script.</li>
<li><strong>Review</strong> facts and claims before publishing.</li>
</ol>`},
{ title: "What to use AI for in marketing", html: `
<ul>
<li>Content calendars and topic ideas from customer questions.</li>
<li>First drafts of posts, emails, blog articles, product descriptions and ads.</li>
<li>Headline and subject-line variations to test.</li>
<li>Rewriting for different platforms and lengths.</li>
<li>Video scripts and talking points (you still film it).</li>
<li>Summarising reviews and feedback into themes you can respond to.</li>
<li>Checking copy for clarity and reading level.</li>
</ul>`},
{ title: "Stay honest", html: `
<p>Advertising law applies to AI-written marketing exactly as it does to anything else:</p>
<ul>
<li>No invented statistics, awards, customer numbers or results.</li>
<li><strong>Never</strong> use AI to write fake reviews or testimonials. It's illegal in the UK and destroys trust.</li>
<li>Be careful with "before and after" or results claims. They must be typical and provable.</li>
<li>If you use AI-generated images of people or realistic scenes, consider labelling them, and don't use them to mislead.</li>
</ul>`}
],
exercise: { title: "Your content engine", intro: "Plan one month of content in 20 minutes.", fields: [
 { id: "m6_questions", label: "List 10 questions customers often ask you", type: "textarea" },
 { id: "m6_channels", label: "Which channels matter most for you (and how often can you realistically post)?", type: "textarea" },
 { id: "m6_story", label: "One real story or result from your business you could build content around", type: "textarea" }
]},
templates: [
 { title: "Monthly content plan prompt", text: "[PASTE BRAND VOICE BRIEF]\n\nHere are 10 questions our customers often ask:\n[LIST]\n\nCreate a 4-week content plan for [CHANNELS] at [FREQUENCY]. For each post: the question it answers, a working headline, the format (post, carousel, short video, email), and a call to action. Don't invent facts, statistics or results." },
 { title: "Repurpose prompt", text: "[PASTE BRAND VOICE BRIEF]\n\nTurn the article below into: (1) a LinkedIn post under 200 words, (2) three Instagram captions under 60 words, (3) a 45-second video script, (4) a newsletter paragraph with a link placeholder. Keep every fact exactly as in the original.\n\n[PASTE ARTICLE]" },
 { title: "Review response prompt", text: "[PASTE BRAND VOICE BRIEF]\n\nWrite a reply to this customer review. If positive: thank them specifically, under 50 words. If negative: acknowledge, don't argue, offer to resolve offline via [CONTACT], under 80 words. Don't admit legal liability.\n\nReview: [PASTE]" }
],
quiz: [
 { q: "What makes AI-assisted content worth reading?", options: ["Publishing more of it", "Adding real stories, details and opinions from your business", "Using longer words"], a: 1, why: "The human part is what generic AI content lacks." },
 { q: "Can you use AI to write customer testimonials for your website?", options: ["Yes, if they sound realistic", "No. Fake reviews and testimonials are illegal and misleading", "Only on social media"], a: 1, why: "Testimonials must come from real customers." },
 { q: "A good source of content topics is…", options: ["Real questions customers ask you", "Random trending hashtags", "Whatever AI suggests without context"], a: 0, why: "Customer questions show what your audience actually wants to know." }
]
},

{
id: "m7",
title: "Sales, enquiries and customer service",
time: "45 min",
goal: "Reply faster, follow up reliably and give better customer service, with AI doing the drafting and you keeping the relationship.",
lessons: [
{ title: "Speed to reply", html: `
<p>For many small businesses, the biggest leak isn't marketing; it's slow or missed replies to people who already got in touch. AI helps by:</p>
<ul>
<li>Drafting a personalised first reply in seconds from the enquiry.</li>
<li>Summarising long or rambling enquiries into the key needs and questions.</li>
<li>Suggesting the next question to qualify the lead (budget, timing, location, scope).</li>
<li>Creating saved reply templates for your most common enquiry types.</li>
</ul>
<p>Pair this with a simple lead tracker so nothing is forgotten. A reply that arrives the same day often beats a better reply that arrives next week.</p>`},
{ title: "Follow-up that doesn't feel pushy", html: `
<p>Most sales are lost through silence, not rejection. Use AI to write a short sequence for quotes and proposals:</p>
<ol>
<li><strong>Day 2:</strong> check they received it, offer to answer questions.</li>
<li><strong>Day 5:</strong> add value: a relevant tip, example or answer to a common concern.</li>
<li><strong>Day 10:</strong> a polite close-the-loop: "Shall I close this for now?"</li>
</ol>
<p>Write each in your voice once, save them, and personalise a line each time.</p>`},
{ title: "Customer service and chatbots", html: `
<p>AI can draft replies to customer emails, suggest answers from your FAQs, and power a website chatbot. Ground rules:</p>
<ul>
<li>Base answers on <strong>your</strong> information (FAQs, policies, prices). Don't let a bot improvise about refunds, safety or prices.</li>
<li>Make it clear to customers when they're talking to an automated assistant, and always offer a route to a person.</li>
<li>Never let AI promise refunds, compensation or legal outcomes without human approval.</li>
<li>Review a sample of conversations every week.</li>
</ul>`},
{ title: "Meetings and calls", html: `
<p>Transcription and summary tools can turn a sales call into notes, actions and a follow-up email. Always tell people when you're recording or transcribing, and get agreement where required. Check the summary: tools mishear names, numbers and accents.</p>`}
],
exercise: { title: "Your enquiry system", intro: "Fix the leak between 'they got in touch' and 'they bought'.", fields: [
 { id: "m7_types", label: "Your 3–5 most common enquiry types", type: "textarea" },
 { id: "m7_reply", label: "How fast do you reply today, and what's your target?", type: "text" },
 { id: "m7_followup", label: "Write your Day 2 quote follow-up (draft it with AI, then edit)", type: "textarea" }
]},
templates: [
 { title: "Enquiry reply prompt", text: "[PASTE BRAND VOICE BRIEF]\n\nA potential customer sent the enquiry below. Write a reply that: thanks them by name, shows we understood what they need, answers any direct questions using only the information I give you, asks up to 2 questions we need answered to quote, and suggests a clear next step ([CALL / VISIT / QUOTE]). Under 150 words.\n\nOur information: [PRICES / AVAILABILITY / AREA]\nEnquiry: [PASTE]" },
 { title: "Follow-up sequence prompt", text: "[PASTE BRAND VOICE BRIEF]\n\nWe sent a quote for [SERVICE] to [TYPE OF CUSTOMER] on [DATE]. Write three short follow-up emails for day 2, day 5 and day 10. Friendly, never pushy, no fake urgency or discounts. The day 10 email politely asks whether to close the quote. Under 80 words each." },
 { title: "Call summary prompt", text: "Summarise this call transcript into: (1) the customer's main needs, (2) concerns or objections, (3) what we promised, (4) agreed next steps with owners and dates, (5) a draft follow-up email. Flag anything unclear rather than guessing.\n\n[PASTE TRANSCRIPT]" }
],
quiz: [
 { q: "What's often the biggest sales leak for small businesses?", options: ["Not enough social media posts", "Slow or missing replies and follow-ups", "Website colours"], a: 1, why: "People who already enquired are the warmest leads. Speed and follow-up matter most." },
 { q: "A website chatbot should…", options: ["Improvise answers about refunds to keep customers happy", "Answer from your approved information and offer a route to a person", "Pretend to be a human"], a: 1, why: "Ground it in your information, be transparent, and keep a human route." },
 { q: "Before using AI transcription on a call you should…", options: ["Tell the other person you're recording or transcribing", "Do nothing, it's automatic", "Only use it for internal calls"], a: 0, why: "Transparency and, where needed, consent are essential." }
]
},

{
id: "m8",
title: "Operations, admin and finance",
time: "40 min",
goal: "Take the drudgery out of admin with AI, while keeping numbers, contracts and people decisions safe.",
lessons: [
{ title: "Admin that AI does well", html: `
<ul>
<li><strong>Writing procedures:</strong> turn "how we do it" notes or a voice memo into a clear step-by-step guide (SOP).</li>
<li><strong>Templates:</strong> job adverts, onboarding checklists, supplier letters, standard emails.</li>
<li><strong>Documents:</strong> summarise long documents, compare two versions, extract key dates and obligations.</li>
<li><strong>Spreadsheets:</strong> explain or write formulas, clean messy data, suggest a structure for a tracker.</li>
<li><strong>Planning:</strong> project plans, checklists, rotas (checked by a person), meeting agendas.</li>
</ul>`},
{ title: "Numbers: use AI to understand, not to account", html: `
<p>AI can help you <em>understand</em> your numbers: explain a profit and loss report, suggest what to look at, write formulas or turn figures into a plain-English summary. But:</p>
<ul>
<li>Don't rely on AI for tax calculations, VAT returns or statutory accounts. Use proper software and your accountant.</li>
<li>Check every figure AI produces against the source.</li>
<li>Be careful what financial data you share (see Module 4).</li>
</ul>
<div class="callout">Good prompt: "Here are my monthly revenue and cost figures (no names). Explain in plain English what's changed, what might be worth investigating, and what questions I should ask my accountant."</div>`},
{ title: "People decisions need people", html: `
<p>AI can help write a job advert or interview questions, but don't let it screen out candidates, decide pay or judge performance on its own. These decisions affect people significantly, may be covered by automated-decision rules, and are where bias does the most damage. Use AI to prepare; let people decide.</p>`},
{ title: "Contracts and legal text", html: `
<p>AI is useful for summarising a contract, listing obligations and dates, or drafting a first version of simple terms. It is not a substitute for legal advice. Always have important contracts and policies checked by a qualified professional.</p>`}
],
exercise: { title: "Your admin quick wins", intro: "Pick the admin you'd most like to stop doing manually.", fields: [
 { id: "m8_sop", label: "Which process would you document first as an SOP with AI's help?", type: "textarea" },
 { id: "m8_admin", label: "Three admin tasks to try with AI this month", type: "textarea" },
 { id: "m8_never", label: "Which decisions in your business must always stay fully human?", type: "textarea" }
]},
templates: [
 { title: "SOP from notes prompt", text: "Turn my rough notes below into a clear standard operating procedure. Include: purpose, who does it, when, what's needed, numbered steps, common mistakes to avoid, and a short checklist. Plain UK English a new starter could follow. Mark anything unclear with [CHECK].\n\n[PASTE NOTES OR TRANSCRIPT]" },
 { title: "Spreadsheet helper prompt", text: "I use [EXCEL / GOOGLE SHEETS]. My data has columns: [LIST COLUMNS, e.g. A=Date, B=Customer, C=Amount]. I want to [GOAL, e.g. total sales per month]. Give me the formula, explain it in one sentence, and tell me where to put it." },
 { title: "Plain-English numbers prompt", text: "Here are my business's monthly figures (anonymised):\n[PASTE TABLE]\n\nIn plain English: what changed most, what might explain it (as possibilities, not facts), what I should investigate, and five questions to ask my accountant. Don't give tax advice." }
],
quiz: [
 { q: "Should AI prepare your VAT return on its own?", options: ["Yes, it's faster", "No. Use proper software and your accountant; use AI to understand numbers", "Only if the figures are small"], a: 1, why: "Tax and statutory figures need proper tools and professional responsibility." },
 { q: "A good admin use of AI is…", options: ["Turning rough notes into a clear step-by-step procedure", "Deciding which job applicants to reject", "Signing contracts"], a: 0, why: "Documentation is low-risk and high-value; people decisions should stay human." },
 { q: "AI summarises a contract for you. What next?", options: ["Sign it", "Use the summary to understand it and get important contracts professionally checked", "Ignore the summary"], a: 1, why: "Summaries aid understanding; they're not legal advice." }
]
},

{
id: "m9",
title: "Automations and AI agents",
time: "50 min",
goal: "Understand how to connect your tools so routine work happens automatically, with people in control at the right points.",
lessons: [
{ title: "How an automation works", html: `
<p>Every automation has three parts:</p>
<ol>
<li><strong>Trigger:</strong> something happens (a form is submitted, an email arrives, a payment is received, it's Monday at 8am).</li>
<li><strong>Steps:</strong> things happen in order (copy data to a sheet, ask AI to summarise or classify, create a task, send a notification).</li>
<li><strong>Output:</strong> the result lands where it's useful (your tracker, your inbox, your team chat).</li>
</ol>
<p>Automation platforms such as Zapier, Make or Power Automate connect thousands of apps without code. Many business apps also have built-in automations.</p>`},
{ title: "Five automations worth building first", html: `
<ol>
<li><strong>Enquiry capture:</strong> website form → AI summary and tag → lead tracker → notification to you.</li>
<li><strong>Review requests:</strong> job marked complete → wait 2 days → personalised review request (you approve the template once).</li>
<li><strong>Invoice chasing reminders:</strong> invoice overdue → reminder to <em>you</em> with a drafted chaser to send.</li>
<li><strong>Weekly summary:</strong> Monday 8am → pull last week's sales, leads and tasks → AI writes a short summary for you.</li>
<li><strong>Meeting follow-up:</strong> call ends → transcript → AI summary and action list → saved to the customer record.</li>
</ol>
<p>Notice that most send drafts or reminders to <strong>you</strong> rather than straight to customers. That's deliberate.</p>`},
{ title: "Human-in-the-loop", html: `
<p>Decide, for every automation, where a person must approve before anything leaves the business. A good default:</p>
<ul>
<li><strong>Automatic:</strong> internal steps (saving, tagging, summarising, reminding you).</li>
<li><strong>Approve first:</strong> anything sent to a customer, posted publicly, or involving money.</li>
<li><strong>Never automatic:</strong> refunds, complaints, legal statements, decisions about people.</li>
</ul>
<p>Test every automation with fake data first, watch it for two weeks, and keep a simple log of what it did.</p>`},
{ title: "AI agents: power with limits", html: `
<p>AI agents can carry out multi-step tasks: research, fill in forms, update records, draft and organise. They're improving fast. Use them like a capable new starter on a probation period:</p>
<ul>
<li>Give a narrow, clearly defined job.</li>
<li>Give access only to the tools and data that job needs.</li>
<li>Require approval for anything external, financial or irreversible.</li>
<li>Check their work regularly, and keep records of what they did.</li>
<li>Have a way to stop them instantly.</li>
</ul>
<p>Specialist agents, such as ones that write a weekly business summary, monitor competitors or do sourced research, can deliver real value as a service, as long as a person reviews what they produce.</p>`}
],
exercise: { title: "Design your first automation", intro: "Sketch it before you build it.", fields: [
 { id: "m9_trigger", label: "Trigger: what starts it?", type: "text" },
 { id: "m9_steps", label: "Steps: what happens, in order? Mark which step uses AI", type: "textarea" },
 { id: "m9_human", label: "Where does a person approve before anything leaves the business?", type: "textarea" },
 { id: "m9_measure", label: "How will you know it's working? (time saved, replies faster, fewer missed follow-ups)", type: "textarea" }
]},
templates: [
 { title: "Automation design card", text: "AUTOMATION: [NAME]          Owner: [NAME]\nPurpose: [what problem it fixes]\nTrigger: [what starts it]\nSteps:\n 1. [step]  (automatic / AI / needs approval)\n 2. [step]\n 3. [step]\nOutput: [where the result ends up]\nHuman approval at: [step number]\nNever automatic: [things it must not do]\nTest plan: run with fake data on [DATE]; watch for 2 weeks\nSuccess measure: [before → target]\nOff switch: [how to pause it]" },
 { title: "Classify-and-summarise step prompt", text: "You'll receive a customer enquiry. Return ONLY in this format:\nTYPE: [one of: quote request / booking / question / complaint / supplier / spam]\nURGENCY: [high / normal / low]\nSUMMARY: [one sentence]\nKEY DETAILS: [service, location, timing, budget if mentioned]\nSUGGESTED NEXT STEP: [one sentence]\nIf unsure about any field, write UNSURE.\n\nEnquiry: {{enquiry_text}}" }
],
quiz: [
 { q: "What are the three parts of an automation?", options: ["Trigger, steps, output", "Login, password, logout", "Draft, edit, publish"], a: 0, why: "Something starts it, steps run, a result lands somewhere useful." },
 { q: "Which step should usually need human approval?", options: ["Saving an enquiry to a spreadsheet", "Sending a message to a customer", "Tagging an email"], a: 1, why: "Anything leaving the business should be approved, at least until it's proven." },
 { q: "How should you treat a new AI agent?", options: ["Give it full access so it can do more", "Like a new starter: narrow job, limited access, checked work", "Leave it unsupervised once set up"], a: 1, why: "Limited scope and access, with review, keeps agents safe and useful." }
]
},

{
id: "m10",
title: "Rolling it out and your AI improvement plan",
time: "40 min",
goal: "Bring your team with you, measure what works, and leave with a 90-day plan you'll actually follow.",
lessons: [
{ title: "Bringing your team with you", html: `
<ul>
<li><strong>Explain why:</strong> AI is there to remove the boring parts of jobs, not to replace people's judgement.</li>
<li><strong>Start with volunteers:</strong> the curious people become your champions.</li>
<li><strong>Share wins:</strong> a five-minute "what AI saved me this week" slot in team meetings spreads good practice fast.</li>
<li><strong>Train on your policy:</strong> everyone should know the safety rules from Module 4.</li>
<li><strong>Keep a shared prompt library</strong> (Module 3) so knowledge isn't stuck in one person's head.</li>
</ul>`},
{ title: "Measuring what works", html: `
<p>Use simple measures you can collect without extra work:</p>
<table class="t"><tr><th>Area</th><th>Measure</th></tr>
<tr><td>Time</td><td>Hours per week on a task, before vs after</td></tr>
<tr><td>Speed</td><td>Average time to reply to an enquiry</td></tr>
<tr><td>Reliability</td><td>Follow-ups missed per month</td></tr>
<tr><td>Results</td><td>Enquiry-to-sale rate, reviews received, content published</td></tr>
<tr><td>Quality</td><td>Errors caught in review, customer complaints</td></tr>
<tr><td>Cost</td><td>Tool spend vs value of time saved</td></tr>
</table>
<p>Review after 30, 60 and 90 days. Keep what works, fix or drop what doesn't.</p>`},
{ title: "The 90-day plan", html: `
<ul>
<li><strong>Days 1–30, foundations:</strong> choose tools, write your AI policy and brand voice brief, start three quick wins, measure your "before".</li>
<li><strong>Days 31–60, processes:</strong> build your prompt library, improve one full process (such as enquiries), design your first automation.</li>
<li><strong>Days 61–90, scale and review:</strong> run the automation, train the team, measure results and pick the next three improvements.</li>
</ul>
<p>Use the <strong>My AI Plan</strong> page to pull together everything you wrote in this course into one printable plan.</p>`},
{ title: "When to get help", html: `
<p>You can do a lot yourself with what's in this course. Consider outside help when:</p>
<ul>
<li>You can see something isn't working but can't pin down why.</li>
<li>A project involves connecting several systems or customer-facing AI.</li>
<li>You handle sensitive data or work in a regulated sector.</li>
<li>You don't have the time to build and maintain it yourself.</li>
</ul>
<p>Gainora offers business diagnosis, website and automation work, and ongoing support if you'd like a second pair of eyes. Details at gainora.co.uk.</p>`}
],
exercise: { title: "Your 90-day commitments", intro: "Make them specific: what, who, by when.", fields: [
 { id: "m10_30", label: "Days 1–30: what will you do?", type: "textarea" },
 { id: "m10_60", label: "Days 31–60: what will you do?", type: "textarea" },
 { id: "m10_90", label: "Days 61–90: what will you do?", type: "textarea" },
 { id: "m10_measure", label: "The 3 numbers you'll track to know it's working", type: "textarea" }
]},
templates: [
 { title: "Monthly AI review agenda", text: "MONTHLY AI REVIEW: [DATE] (30 minutes)\n1. Wins: what saved time or improved results? (5 min)\n2. Numbers: measures vs last month (5 min)\n3. Problems: mistakes, near misses, frustrations (5 min)\n4. Policy: anything to add or change? (5 min)\n5. Next: one thing to start, one to stop, one to improve (10 min)\nActions:  ___ owner ___ date ___" }
],
quiz: [
 { q: "What's the best way to spread good AI practice in a team?", options: ["Ban it until everyone is an expert", "Start with volunteers and share wins regularly", "Buy every tool for everyone"], a: 1, why: "Champions and shared examples build confidence and good habits." },
 { q: "Which is a useful, easy measure of AI impact?", options: ["Number of AI tools purchased", "Average time to reply to an enquiry, before and after", "How often staff mention AI"], a: 1, why: "Simple before/after measures show real business impact." },
 { q: "What should the first 30 days focus on?", options: ["Building a complex AI agent", "Tools, policy, voice brief, quick wins and measuring the baseline", "Replacing staff"], a: 1, why: "Foundations first, then processes, then scale." }
]
}
];

</script>
<script>
(function(){
const KEY='gainora.course.aiforbusiness.v1';
let mem={};
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}catch(e){return {}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));mark('Saved on this device')}catch(e){mark('Not saved (browser storage off). Use Backup.')}}
let S=load(); S.answers=S.answers||{}; S.read=S.read||{}; S.quiz=S.quiz||{}; S.done=S.done||{}; S.audit=S.audit||[]; S.page=S.page||'home';
const $=s=>document.querySelector(s);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mark(t){const el=$('#saved');if(el)el.textContent=t}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
function pct(){return Math.round(Object.keys(S.done).filter(k=>S.done[k]).length/MODULES.length*100)}
function nav(){
 const items=[['home','⌂','Start here']].concat(MODULES.map((m,i)=>[m.id,String(i+1),m.title])).concat([['sep'],['plan','★','My AI Plan'],['library','≡','All templates'],['settings','⚙','Settings & backup']]);
 $('#nav').innerHTML=items.map(it=>it[0]==='sep'?'<div class="sep"></div>':`<button data-go="${it[0]}" class="${S.page===it[0]?'on':''} ${S.done[it[0]]?'done':''}"><span class="n">${S.done[it[0]]?'✓':it[1]}</span><span>${E(it[2])}</span></button>`).join('');
 const p=pct(); $('#prog').innerHTML=`Course progress: ${p}%<div class="bar"><i style="width:${p}%"></i></div>`;
}
function go(p){S.page=p;persist();render();window.scrollTo(0,0);$('#side').classList.remove('open')}
function home(){
 const next=MODULES.find(m=>!S.done[m.id]);
 return `<div class="eyebrow">Welcome</div><h1>Put AI to work in your business.</h1>
 <p class="lede">A practical course for owners and teams. Ten short modules take you from "what is this?" to a 90-day plan, with templates you can use straight away.</p>
 <div class="row noprint">${next?`<button class="btn" data-go="${next.id}">${pct()?'Continue':'Start'}: Module ${MODULES.indexOf(next)+1}</button>`:`<button class="btn" data-go="plan">View my AI plan</button>`}<button class="btn sec" data-go="plan">My AI Plan</button></div>
 <div class="card"><h3>How the course works</h3><ol><li>Read each module's short lessons (about 30–50 minutes per module).</li><li>Complete the exercise. Your answers build your personal AI plan automatically.</li><li>Copy the ready-made templates and prompts into your AI tool.</li><li>Answer the three quiz questions to complete the module.</li></ol><p>Everything is saved in this browser on this device. It works offline. Use <strong>Settings &amp; backup</strong> to save a backup or move to another device.</p></div>
 <h2>Modules</h2><div class="grid">${MODULES.map((m,i)=>`<button class="mod" data-go="${m.id}"><div class="k">Module ${i+1} · ${m.time}</div><h3>${E(m.title)}</h3><span class="chip ${S.done[m.id]?'ok':''}">${S.done[m.id]?'Completed':'Not started'}</span></button>`).join('')}</div>
 <div class="card"><h3>Important</h3><p>This course gives general, practical information. It isn't legal, financial or tax advice. AI tools, prices and rules change often, so check current terms and guidance before relying on them.</p></div>`;
}
function field(f){const v=S.answers[f.id]||'';return `<label for="${f.id}">${E(f.label)}</label>${f.type==='textarea'?`<textarea id="${f.id}" data-ans="${f.id}">${E(v)}</textarea>`:`<input type="text" id="${f.id}" data-ans="${f.id}" value="${E(v)}">`}`}
function auditScore(r){const t=+r.hours||0,f=+r.fit||0,v=+r.value||0,k=+r.risk||1;return t&&f&&v?Math.round(t*f*v/k*10)/10:0}
function updScore(i){const el=document.getElementById('sc'+i);if(el)el.textContent=auditScore(S.audit[i])||'—'}
function audit(){
 const rows=S.audit.length?S.audit:[];
 const sel=(i,k)=>`<select data-aud="${i}" data-k="${k}">${['','1','2','3','4','5'].map(o=>`<option ${String(rows[i][k]||'')===o?'selected':''}>${o}</option>`).join('')}</select>`;
 return `<div class="audit"><table class="t"><tr><th>Task</th><th>Hours / week</th><th>AI fit 1–5</th><th>Value 1–5</th><th>Risk 1–5</th><th>Score</th><th></th></tr>
 ${rows.map((r,i)=>`<tr><td><input type="text" data-aud="${i}" data-k="task" value="${E(r.task)}" placeholder="e.g. Replying to enquiries"></td><td><input type="number" min="0" step="0.5" data-aud="${i}" data-k="hours" value="${E(r.hours)}"></td><td>${sel(i,'fit')}</td><td>${sel(i,'value')}</td><td>${sel(i,'risk')}</td><td><strong id="sc${i}">${auditScore(r)||'—'}</strong></td><td><button class="btn sec small" data-delaud="${i}">✕</button></td></tr>`).join('')}
 </table></div><button class="btn sec small" id="addAud">+ Add task</button>
 <p class="lede" style="font-size:.95rem">Score = hours × fit × value ÷ risk. Higher scores are better first projects. Your top three appear in My AI Plan.</p>`;
}
function module(m){
 const i=MODULES.indexOf(m), q=S.quiz[m.id]||{};
 const answered=m.quiz.every((_,k)=>q[k]!=null);
 return `<div class="eyebrow">Module ${i+1} of ${MODULES.length} · ${m.time}</div><h1>${E(m.title)}</h1><p class="lede">${E(m.goal)}</p>
 ${m.lessons.map((l,k)=>{const id=m.id+'_'+k;return `<section class="card lesson"><h3><span>${k+1}. ${E(l.title)}</span><span class="chip ${S.read[id]?'ok':''}">${S.read[id]?'Read':'To read'}</span></h3><div class="body">${l.html}</div><div class="noprint"><button class="btn sec small" data-read="${id}">${S.read[id]?'Mark as unread':'Mark as read'}</button></div></section>`}).join('')}
 <section class="card"><div class="eyebrow">Exercise</div><h2>${E(m.exercise.title)}</h2><p>${E(m.exercise.intro)}</p>${m.exercise.audit?audit():m.exercise.fields.map(field).join('')}</section>
 <section class="card"><div class="eyebrow">Templates and prompts</div><h2>Ready to use</h2><p>Replace the [BRACKETS] with your details. Remember the safety rules in Module 4.</p>${m.templates.map(tpl).join('')}</section>
 <section class="card"><div class="eyebrow">Quick check</div><h2>Three questions</h2>${m.quiz.map((qq,k)=>{const pick=q[k];return `<div class="q"><strong>${k+1}. ${E(qq.q)}</strong>${qq.options.map((o,j)=>`<button class="opt ${pick!=null&&j===qq.a?'right':''} ${pick===j&&j!==qq.a?'wrong':''}" data-quiz="${m.id}" data-k="${k}" data-j="${j}">${E(o)}</button>`).join('')}${pick!=null?`<div class="why">${pick===qq.a?'<strong>Correct.</strong> ':'<strong>Not quite.</strong> '}${E(qq.why)}</div>`:''}</div>`}).join('')}</section>
 <div class="row noprint">${S.done[m.id]?`<span class="chip ok">Module completed</span>`:`<button class="btn" data-complete="${m.id}" ${answered?'':'disabled style="opacity:.5;cursor:not-allowed"'}>Mark module complete</button>${answered?'':'<span class="chip">Answer the quiz to complete</span>'}`}
 ${i<MODULES.length-1?`<button class="btn sec" data-go="${MODULES[i+1].id}">Next: Module ${i+2} →</button>`:`<button class="btn sec" data-go="plan">Build my AI plan →</button>`}</div>`;
}
let TID=0;function tpl(t){const id='tpl'+(TID++);mem[id]=t.text;return `<div class="tpl"><div class="h"><span>${E(t.title)}</span><button class="btn small noprint" data-copy="${id}">Copy</button></div><pre>${E(t.text)}</pre></div>`}
function library(){return `<div class="eyebrow">Library</div><h1>All templates and prompts</h1><p class="lede">Every template from the course in one place.</p>${MODULES.map((m,i)=>`<section class="card"><h2>Module ${i+1}: ${E(m.title)}</h2>${m.templates.map(tpl).join('')}</section>`).join('')}`}
function plan(){
 const a=k=>S.answers[k]?`<p>${E(S.answers[k])}</p>`:'<p class="empty">Not completed yet</p>';
 const top=S.audit.filter(r=>r.task&&auditScore(r)).sort((x,y)=>auditScore(y)-auditScore(x)).slice(0,3);
 const blk=(t,k)=>`<div class="planblock"><h3>${t}</h3>${a(k)}</div>`;
 return `<div class="eyebrow">Your plan</div><h1>My AI improvement plan</h1><p class="lede">Built automatically from your exercise answers. Edit any answer in its module, then print or save as PDF.</p>
 <div class="row noprint"><button class="btn" id="printBtn">Print / save as PDF</button><span class="chip">${pct()}% of course complete</span></div>
 <section class="card"><h2>1. Where we are now</h2>${blk('Tools we use today','m1_using')}${blk('Our main concern','m1_worry')}${blk('What we\'ll do with time saved','m1_hope')}</section>
 <section class="card"><h2>2. Our tools</h2>${blk('Standard AI assistant and licences','m2_assistant')}${blk('AI features in existing software to test','m2_existing')}${blk('90-day test budget (£)','m2_budget')}</section>
 <section class="card"><h2>3. Safety rules</h2>${blk('Never goes into AI','m4_nogo')}${blk('Always checked by a person','m4_review')}${blk('Responsible person','m4_owner')}</section>
 <section class="card"><h2>4. Our top opportunities</h2>${top.length?`<table class="t"><tr><th>Task</th><th>Hours/week</th><th>Score</th></tr>${top.map(r=>`<tr><td>${E(r.task)}</td><td>${E(r.hours)}</td><td>${auditScore(r)}</td></tr>`).join('')}</table>`:'<p class="empty">Complete the task audit in Module 5</p>'}</section>
 <section class="card"><h2>5. Voice and content</h2>${blk('Who we are and who we serve','m3_who')}${blk('Our tone','m3_tone')}${blk('Customer questions to build content around','m6_questions')}${blk('Channels and frequency','m6_channels')}</section>
 <section class="card"><h2>6. Sales and operations</h2>${blk('Common enquiry types','m7_types')}${blk('Reply speed: now and target','m7_reply')}${blk('First process to document','m8_sop')}${blk('Admin tasks to try with AI','m8_admin')}${blk('Decisions that stay human','m8_never')}</section>
 <section class="card"><h2>7. First automation</h2>${blk('Trigger','m9_trigger')}${blk('Steps','m9_steps')}${blk('Human approval','m9_human')}${blk('Success measure','m9_measure')}</section>
 <section class="card"><h2>8. 90-day plan</h2>${blk('Days 1–30','m10_30')}${blk('Days 31–60','m10_60')}${blk('Days 61–90','m10_90')}${blk('Numbers we\'ll track','m10_measure')}</section>`;
}
function settings(){return `<div class="eyebrow">Settings</div><h1>Settings and backup</h1>
 <section class="card"><h2>Your data</h2><p>Your answers and progress are saved only in this browser, on this device. Nothing is sent anywhere. If you clear your browser data or switch device, they're gone unless you've saved a backup.</p>
 <div class="row"><button class="btn" id="backupBtn">↓ Download backup</button><label class="btn sec" style="margin:0">↑ Restore backup<input type="file" id="restoreFile" accept="application/json" hidden></label></div></section>
 <section class="card"><h2>Start again</h2><p>Clear all answers and progress on this device.</p><button class="btn sec" id="resetBtn">Reset course</button></section>
 <section class="card"><h2>About</h2><p>${E(COURSE.title)} · ${E(COURSE.version)}<br>Questions or feedback: <a href="mailto:hello@gainora.co.uk">hello@gainora.co.uk</a></p></section>`}
function render(){
 TID=0;mem={};
 const m=MODULES.find(x=>x.id===S.page);
 $('#content').innerHTML=m?module(m):S.page==='plan'?plan():S.page==='library'?library():S.page==='settings'?settings():home();
 nav();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-go]'); if(!t)return;
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.read){S.read[t.dataset.read]=!S.read[t.dataset.read];persist();render();return}
 if(t.dataset.quiz){(S.quiz[t.dataset.quiz]=S.quiz[t.dataset.quiz]||{})[t.dataset.k]=+t.dataset.j;persist();const y=window.scrollY;render();window.scrollTo(0,y);return}
 if(t.dataset.complete){S.done[t.dataset.complete]=true;persist();render();toast('Module completed');return}
 if(t.dataset.copy){const txt=mem[t.dataset.copy];(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied'),()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copied')}catch(x){toast('Select and copy the text')}ta.remove()});return}
 if(t.dataset.delaud){S.audit.splice(+t.dataset.delaud,1);persist();render();return}
 if(t.id==='addAud'){S.audit.push({task:'',hours:'',fit:'',value:'',risk:''});persist();render();return}
 if(t.id==='menuBtn'){$('#side').classList.toggle('open');return}
 if(t.id==='printBtn'){window.print();return}
 if(t.id==='backupBtn'){const b=new Blob([JSON.stringify({app:'gainora-ai-course',version:1,saved:new Date().toISOString(),data:S},null,1)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='gainora-ai-course-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup downloaded');return}
 if(t.id==='resetBtn'){if(confirm('Clear all answers and progress? Download a backup first if you want to keep them.')){S={answers:{},read:{},quiz:{},done:{},audit:[],page:'home'};persist();render()}return}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.ans){S.answers[t.dataset.ans]=t.value;persist()}
 if(t.dataset.aud!=null&&t.dataset.k){S.audit[+t.dataset.aud][t.dataset.k]=t.value;persist();updScore(+t.dataset.aud)}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.aud!=null&&t.dataset.k&&t.tagName==='SELECT'){S.audit[+t.dataset.aud][t.dataset.k]=t.value;persist();updScore(+t.dataset.aud)}
 if(t.id==='restoreFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='gainora-ai-course'||!d.data)throw Error('Not a course backup');S=Object.assign({answers:{},read:{},quiz:{},done:{},audit:[],page:'home'},d.data);persist();render();toast('Backup restored')}catch(x){alert('Could not restore backup: '+x.message)}};r.readAsText(t.files[0])}
});
render();
})();
</script>
</body>
</html>
