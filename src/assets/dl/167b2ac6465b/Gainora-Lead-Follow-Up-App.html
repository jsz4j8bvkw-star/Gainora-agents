'use strict';
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const E=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UK=(v)=>{if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T12:00:00');return Number.isNaN(d.valueOf())?'—':new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)};
const GBP=(n)=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const PCT=(n)=>((Number(n)||0)*100).toFixed(1)+'%';
const ISO=(d=new Date())=>{const t=new Date(d);return [t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')};
const addDays=(iso,n)=>{if(!iso)return '';const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setDate(d.getDate()+Number(n));return ISO(d)};
const daysBetween=(a,b)=>{if(!a||!b)return null;const p=new Date(String(a).slice(0,10)+'T12:00:00'),q=new Date(String(b).slice(0,10)+'T12:00:00');return Math.round((q-p)/86400000)};
const nval=v=>{let n=Number(v);return Number.isFinite(n)?n:0};
const clone=x=>JSON.parse(JSON.stringify(x));
const guid=()=>{try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}};
function saveFile(filename,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const saveText=(name,s,type='text/plain')=>saveFile(name,new Blob([s],{type:type+';charset=utf-8'}));
const csvField=(x)=>{let s=String(x??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
const csv=(rows)=>'\ufeff'+rows.map(r=>r.map(csvField).join(',')).join('\r\n');

const KEY_PREFIX='gainora.browser.v1.';
function initialiseData(slug,make){try{const raw=localStorage.getItem(KEY_PREFIX+slug);if(raw){const d=JSON.parse(raw);if(d&&d.app===slug&&d.version===1)return d}}catch(e){console.warn('Storage unavailable',e)}return make()}
function persist(){try{localStorage.setItem(KEY_PREFIX+APP.slug,JSON.stringify(APP.data));const el=$('#saveStatus');if(el){el.textContent='Saved on this device';el.className='savestatus'}}catch(e){const el=$('#saveStatus');if(el){el.textContent='Storage unavailable — export a backup';el.className='savestatus alert'}showToast('Browser storage unavailable. Export a backup before closing.')}}
function showToast(s){const e=$('#toast');if(!e)return;e.textContent=s;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),4000)}
function backup(){saveText('Gainora-'+APP.slug+'-Backup-'+ISO()+'.json',JSON.stringify(APP.data,null,2),'application/json');showToast('Backup downloaded. Keep it somewhere safe.')}
function restore(){const f=$('#restoreFile');f.value='';f.click()}
function onRestore(e){const f=e.target.files[0];if(!f)return;if(!confirm('Replace all current data with the selected backup? Export your current data first if needed.'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!==APP.slug||d.version!==1)throw Error('This file is not a matching Gainora backup.');APP.data=d;persist();APP.page='home';APP.render();showToast('Backup restored.')}catch(ex){alert('Could not restore backup: '+ex.message)}};r.readAsText(f)}

function appShell(){return `<div class="shell"><aside class="sidebar"><div class="brand"><img src="data:image/png;base64,${LOGO_B64}" alt="Gainora logo"><small>${E(APP.product)}</small></div><div class="navlabel">WORKSPACE</div><nav>${APP.nav.map(([p,l,i])=>`<button class="navbtn ${APP.page===p?'active':''}" data-nav="${E(p)}"><span class="navicon">${i}</span>${E(l)}</button>`).join('')}</nav><div class="sidebarBottom"><strong>Private by design</strong><p>Works offline. Your records stay in this browser unless you export them.</p><p class="tiny">Back up your data regularly.</p></div></aside><div class="mainArea"><header class="topbar"><button class="mobilebrand" data-nav="home"><img src="data:image/png;base64,${LOGO_B64}" alt="Gainora"></button><span class="topname">${E(APP.product)}</span><div class="topright"><span id="saveStatus" class="savestatus">Saved on this device</span>${btn('backup','↓ Backup','outline')}</div></header><main class="content" id="content"></main>${footer()}</div></div><input id="restoreFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status" class="toast"></div>`}
function init(){APP.data=initialiseData(APP.slug,APP.initial);document.body.innerHTML=appShell();try{const k=KEY_PREFIX+'storage-check';localStorage.setItem(k,'1');if(localStorage.getItem(k)!=='1')throw Error('Storage write unavailable');localStorage.removeItem(k)}catch(ex){let el=$('#saveStatus');el.textContent='Storage unavailable — export backups';el.className='savestatus alert';showToast('This browser does not permit local saving here. Export a JSON backup after every session.')}$('#restoreFile').addEventListener('change',onRestore);document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){nav(navEl.dataset.nav);return}const actEl=e.target.closest('[data-act]');if(actEl){const act=actEl.dataset.act;if(act==='backup')return backup();if(act==='restore')return restore();APP.action(act,actEl)}});document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();APP.submit(f.dataset.form,Object.fromEntries(new FormData(f)))}});APP.render();}

const APP={slug:'Lead-Follow-Up-System',product:'Lead Follow-Up System',page:'home',editing:null,nav:[['home','Overview','▦'],['leads','Lead tracker','≡'],['today','Follow-ups','◷'],['dashboard','Dashboard','▥'],['templates','Message library','✉'],['settings','Settings & backup','⚙'],['guide','How to use','?']],
initial(){return {app:'Lead-Follow-Up-System',version:1,settings:{business:'My business',owners:['Owner'],sources:['Phone','Email','Website form','Instagram','Facebook','WhatsApp','Referral','Walk-in','Other'],statuses:['New','Contacted','Quote sent','Follow-up due','Won','Lost','No reply'],lost:['Price','Timing','Went elsewhere','No response','Not a fit','Other'],gaps:[2,5,10]},leads:[],notes:''}},
next(l){if(!l.last||!nval(l.attempts)||['Won','Lost'].includes(l.status))return '';let gaps=this.data.settings.gaps;return addDays(l.last,gaps[Math.min(2,Math.max(0,nval(l.attempts)-1))]||10)},

home(){const s=this.getStats(),due=this.data.leads.filter(l=>this.flag(l)).sort((a,b)=>(this.next(a)||'').localeCompare(this.next(b)||''));return heading('GAINORA CONTROL CENTRE','Never lose a good enquiry.','See what needs a reply, then move each conversation forward.',btn('new','+ Add new lead','primary'))+`<div class="grid">${kv('Active enquiries',s.active,'Still in progress')}${kv('Need action now',s.due,`${s.over} overdue`)}${kv('Open pipeline value',GBP(s.openValue),'Estimated, not guaranteed')}${kv('Won value',GBP(s.wonValue),'Recorded won jobs')}</div><div class="split">${box('Priority follow-ups',due.length?table(['Lead','Stage','Value','Action',''],due.slice(0,8).map(l=>`<tr><td><b>${E(l.name)}</b><small>${E(l.company)}</small></td><td>${statusPill(l.status)}</td><td>${GBP(l.estimate)}</td><td>${statusPill(this.flag(l),this.flag(l)==='OVERDUE'?'red':'amber')}</td><td>${btn('edit','Open','outline',`data-id="${E(l.id)}"`)}</td></tr>`)):empty('No overdue or due follow-ups. Check new enquiries received today as well.'))}${box('Your daily routine',`<ol><li>Open the follow-up list.</li><li>Send a helpful, personalised reply.</li><li>Record the contact and number of attempts.</li><li>Update the status and check the next date.</li><li>Back up your records weekly.</li></ol>${btn('viewdue','See today’s actions','secondary')}${notice('This app does not send messages or automatic phone notifications. Open it to see your due list.')}`)}</div>`},
listFilter:{q:'',status:'',source:''},

editPage(){const l=this.data.leads.find(x=>x.id===this.editing)||{id:'',received:ISO(),name:'',company:'',phone:'',email:'',source:'',want:'',estimate:'',owner:'',status:'New',last:'',attempts:0,outcome:'',wonValue:'',lostReason:'',notes:'',receivedAt:'',firstReplyAt:'',quoteDate:''},s=this.data.settings;return heading('LEAD DETAILS',l.id?'Update enquiry':'Add an enquiry','Record what you know, then update the next step after you contact them.',btn('cancel','← Back','outline'))+`<form data-form="lead" class="panel"><div class="formgrid">${input('Date received','received',l.received,'date','required')}${input('Name','name',l.name,'text','required maxlength="100"')}${input('Business / company','company',l.company)}${input('Phone','phone',l.phone,'tel')}${input('Email','email',l.email,'email')}${select('Source','source',s.sources,l.source)}${textarea('What they want','want',l.want)}${input('Estimated value (£)','estimate',l.estimate,'number','min="0" step="0.01"')}${select('Assigned to','owner',s.owners,l.owner)}${select('Status','status',s.statuses,l.status)}${input('Last contact date','last',l.last,'date')}${input('Contact attempts','attempts',l.attempts,'number','min="0" max="999" step="1"')}${input('Outcome date (for won or lost)','outcome',l.outcome,'date')}${input('Won value (£)','wonValue',l.wonValue,'number','min="0" step="0.01"')}${select('Lost reason','lostReason',s.lost,l.lostReason)}${textarea('Notes / next step','notes',l.notes)}<div class="wide">${notice('Optional tracking for more accurate dashboard metrics: record the time the enquiry arrived and the time you first replied. Quote date records when a quote was sent.')}</div>${input('Enquiry arrived (date and time)','receivedAt',l.receivedAt,'datetime-local')}${input('First reply (date and time)','firstReplyAt',l.firstReplyAt,'datetime-local')}${input('Quote sent date','quoteDate',l.quoteDate,'date')}</div><div class="formButtons"><button type="submit" class="btn primary">Save enquiry</button>${l.id?btn('delete','Delete lead','danger',`data-id="${E(l.id)}"`):''}${btn('cancel','Cancel','outline')}</div></form>`},
dashboard(){let first=ISO().slice(0,7),today=new Date(),prev=ISO(new Date(today.getFullYear(),today.getMonth()-1,10)).slice(0,7),d=this.data.leads;
 const calc=(m)=>{let inc=d.filter(l=>l.received?.slice(0,7)===m),ended=d.filter(l=>l.outcome?.slice(0,7)===m),w=ended.filter(l=>l.status==='Won'),lost=ended.filter(l=>l.status==='Lost'),replied=inc.filter(l=>l.receivedAt&&l.firstReplyAt),in24=replied.filter(l=>{let n=(new Date(l.firstReplyAt)-new Date(l.receivedAt))/3600000;return n>=0&&n<=24}),quotes=d.filter(l=>l.quoteDate?.slice(0,7)===m),dur=w.map(l=>daysBetween(l.received,l.outcome)).filter(n=>n!==null&&n>=0);return {inc,ended,w,lost,quotes,replied,in24,dur,val:w.reduce((a,l)=>a+nval(l.wonValue),0)}};let c=calc(first),p=calc(prev);let sources=this.data.settings.sources.map(name=>({name,n:c.inc.filter(l=>l.source===name).length}));let max=Math.max(1,...sources.map(s=>s.n));let reasons=this.data.settings.lost.map(name=>({name,n:c.lost.filter(l=>l.lostReason===name).length}));return heading('MONTHLY SNAPSHOT','Your lead numbers.','Only entered dates and amounts are counted. Missing timestamps are shown as unknown, not assumed.')+`<div class="grid">${kv('Leads this month',c.inc.length,`Last month: ${p.inc.length}`)}${kv('Replied within 24 hours',c.in24.length,`${c.replied.length} with timestamps · ${c.replied.length?PCT(c.in24.length/c.replied.length):'—'}`)}${kv('Quotes sent',c.quotes.length,`Last month: ${p.quotes.length}`)}${kv('Won / Lost',`${c.w.length} / ${c.lost.length}`,`${c.w.length+c.lost.length?PCT(c.w.length/(c.w.length+c.lost.length)):'—'} conversion`) }${kv('Won value',GBP(c.val),`Last month: ${GBP(p.val)}`)}${kv('Average days to win',c.dur.length?(c.dur.reduce((a,b)=>a+b,0)/c.dur.length).toFixed(1):'—','Recorded wins only')}</div><div class="split equal">${box('Lead sources this month',sources.filter(a=>a.n).length?sources.map(a=>gauge(a.name,a.n,max,''+a.n)).join(''):empty('No source data this month.'))}${box('Lost reasons this month',reasons.some(a=>a.n)?reasons.map(a=>gauge(a.name,a.n,Math.max(1,...reasons.map(x=>x.n)),''+a.n)).join(''):empty('No lost outcomes recorded this month.'))}</div>${box('Won vs lost · by month',`<div class="grid two">${[['Last month',p],['This month',c]].map(([t,m])=>`<div class="card"><h3>${E(t)}</h3>${gauge('Won',m.w.length,Math.max(1,m.w.length,m.lost.length),String(m.w.length))}${gauge('Lost',m.lost.length,Math.max(1,m.w.length,m.lost.length),String(m.lost.length))}</div>`).join('')}</div>${notice('Conversion = Won ÷ (Won + Lost). Reply-within-24-hours percentage uses enquiries with both times entered.')}`)}`},
settingsPage(){let s=this.data.settings;return heading('CUSTOMISE','Settings and safe backups.','These settings control your dropdown lists and follow-up gaps.')+`<form data-form="settings" class="panel"><div class="formgrid">${input('Business name','business',s.business)}${input('Follow-up 1 (days)','g1',s.gaps[0],'number','min="1" max="365"')}${input('Follow-up 2 (days)','g2',s.gaps[1],'number','min="1" max="365"')}${input('Follow-up 3+ (days)','g3',s.gaps[2],'number','min="1" max="365"')}${textarea('Staff / owners (one per line, up to 5)','owners',s.owners.join('\n'))}${textarea('Sources (one per line)','sources',s.sources.join('\n'))}${textarea('Statuses (one per line)','statuses',s.statuses.join('\n'))}${textarea('Lost reasons (one per line)','lost',s.lost.join('\n'))}</div><div class="formButtons"><button class="btn primary" type="submit">Save settings</button></div></form>${box('Protect your records',`<p>Files are saved only in the browser you use. Clearing browser data, switching devices, or using private/incognito mode can remove them.</p><div class="toolbar">${btn('backup','Download JSON backup','primary')}${btn('restore','Restore JSON backup','outline')}${btn('csv','Download CSV','outline')}${btn('loadDemo','Load 25 fictional leads','outline')}${btn('clear','Erase all leads','danger')}</div>${notice('Restore replaces the current data. Back up before restoring. Do not email customer data to people without permission.','warn')}`)}`},
templatesPage(){return heading('READY-TO-EDIT MESSAGES','Messages you can make your own.','Replace every [square-bracket] placeholder, check the context, and send through your normal channel.')+TEMPLATES.map((t,i)=>`<div class="template"><div class="profile"><div><span class="eyebrow">${E(t[1])} · TEMPLATE ${i+1}</span><h3>${E(t[0])}</h3></div>${btn('copyTemplate','Copy message','outline',`data-num="${i}"`)}</div><p>${E(t[2])}</p></div>`).join('')},
guide(){return heading('GET STARTED','Your Gainora 10-minute setup.','No account, paid software or installation required.')+`<section class="panel guide"><div class="guideblock"><h3>1. Set up your workspace (3 minutes)</h3><p>Open Settings. Enter your business name, owners and usual contact sources. Review the follow-up gaps (2, 5 and 10 days by default).</p></div><div class="guideblock"><h3>2. Add your first leads (4 minutes)</h3><p>Open Lead tracker → Add lead. Enter received date, contact details and status. The live working list is empty until you enter records. You can load 25 fictional Northgate Kitchens records in Settings if you want to practise.</p></div><div class="guideblock"><h3>3. Build a five-minute daily habit (3 minutes)</h3><p>Open Follow-ups every working day. Reply through your own email, phone or messaging service, then return here to record the date and attempt number. Check the updated next follow-up date.</p></div><div class="guideblock"><h3>Weekly 15-minute review</h3><p>Review the Dashboard, chase unanswered quotes, check lost reasons and back up your work. Enter the quote-sent date, first reply timestamps and outcome date when known for accurate metrics.</p></div><div class="guideblock"><h3>FAQ & troubleshooting</h3><p><b>Where does data go?</b> It stays in this browser's storage. We cannot retrieve it if the device or browser data is lost. Download a JSON backup at least weekly, and whenever you move devices.</p><p><b>Can staff share a live file?</b> Not in this offline edition. Each browser saves independently. Avoid simultaneous edits across copies; one person should maintain the master.</p><p><b>Why is a lead missing from Today?</b> New leads received today are not flagged until the next day. Follow-up reminders require Last contact date and an attempt number, and Won/Lost stops reminders.</p><p><b>Does it email or notify automatically?</b> No. Use the due list each day. This is not an email-marketing service.</p><p><b>What about customer data?</b> Record only what you need, don't share backups publicly and delete records you no longer need. Handle personal data in line with your obligations.</p></div><div class="callout"><b>Support:</b> hello@gainora.co.uk · gainora.co.uk</div></section>`},
action(act,el){if(act==='new'){this.editing=null;return nav('edit')}if(act==='edit'){this.editing=el.dataset.id;return nav('edit')}if(act==='cancel')return nav('leads');if(act==='viewdue')return nav('today');if(act==='print')return window.print();if(act==='calendar'){let events=this.data.leads.filter(l=>this.flag(l)&&this.next(l));if(!events.length){showToast('No dated follow-ups to export.');return}const escICS=s=>String(s??'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');let parts=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gainora//Lead Follow Up//EN','CALSCALE:GREGORIAN'];for(let l of events){const d=this.next(l).replace(/-/g,'');const end=addDays(this.next(l),1).replace(/-/g,'');parts.push('BEGIN:VEVENT','UID:'+String(l.id).replace(/[^a-zA-Z0-9-]/g,'')+'@gainora.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+escICS('Follow up: '+l.name),'DESCRIPTION:'+escICS('Source: '+l.source+'\n'+l.want+'\n'+l.notes),'END:VEVENT')}parts.push('END:VCALENDAR');saveText('Gainora-Lead-Follow-Up-Calendar-'+ISO()+'.ics',parts.join('\r\n'),'text/calendar');showToast('Calendar file downloaded. Import it into your calendar; alerts depend on calendar settings.');return}if(act==='csv')return saveText('Gainora-Lead-Follow-Up-Leads-'+ISO()+'.csv',csv([['ID','Date received','Name','Business','Phone','Email','Source','What they want','Estimated value','Owner','Status','Last contact','Attempts','Next follow-up','Action','Outcome date','Won value','Lost reason','Notes','Received at','First reply at','Quote date'],...this.data.leads.map(l=>[l.id,l.received,l.name,l.company,l.phone,l.email,l.source,l.want,l.estimate,l.owner,l.status,l.last,l.attempts,this.next(l),this.flag(l),l.outcome,l.wonValue,l.lostReason,l.notes,l.receivedAt,l.firstReplyAt,l.quoteDate])]),'text/csv');if(act==='copyTemplate'){let t=TEMPLATES[+el.dataset.num];let text=t[2];if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(()=>showToast('Copied. Check all placeholders.')).catch(()=>prompt('Copy message:',text));else prompt('Select and copy:',text);return}if(act==='delete'){if(confirm('Delete this lead permanently? Download a backup first if needed.')){this.data.leads=this.data.leads.filter(l=>l.id!==el.dataset.id);persist();nav('leads')}}if(act==='clear'){if(confirm('Erase ALL lead records on this device? This cannot be undone without a backup.')){this.data.leads=[];persist();this.render()}}if(act==='loadDemo'){if(this.data.leads.length&&!confirm('Append 25 fictional Northgate Kitchens leads to your existing records?'))return;let names=['Emma Reed','Oliver Price','Amelia Harris','George Turner','Isla Clark','Jack Wilson','Mia Lewis','Noah Hill','Sophie Scott','Harry King','Grace Moore','Oscar Baker','Ella Ward','Leo Evans','Ava Carter','Theo Green','Freya James','Arthur Brooks','Ruby Parker','Henry Morgan','Lily Cooper','Thomas Phillips','Chloe Wright','James Foster','Evie Bennett'];for(let i=0;i<25;i++){let status=this.data.settings.statuses[i%7]||'New';let received=addDays(ISO(),-((i*3)%70+1)),outcome=['Won','Lost'].includes(status)?addDays(received,11):'',last=addDays(received,Math.min(4,(i%4)+1));this.data.leads.push({id:guid(),received,name:names[i],company:i%3?'':'Northgate Kitchens enquiry',phone:'07700 900'+String(i).padStart(3,'0'),email:'',source:this.data.settings.sources[i%this.data.settings.sources.length],want:['Kitchen renovation','Cabinet replacement','Worktop quote','Design consultation'][i%4],estimate:1200+i*210,owner:this.data.settings.owners[0]||'Owner',status,last,attempts:i%4+1,outcome,wonValue:status==='Won'?1300+i*185:0,lostReason:status==='Lost'?'Timing':'',notes:'FICTIONAL DEMO — Northgate Kitchens',receivedAt:'',firstReplyAt:'',quoteDate:status==='Quote sent'?last:''})}persist();this.render();showToast('25 fictional leads added. Remove them before entering real customer data.')}} ,
submit(form,data){if(form==='lead'){if(!data.name?.trim()){alert('Enter a name.');return}if(!data.received){alert('Enter the date received.');return}let obj={...data,estimate:nval(data.estimate),wonValue:nval(data.wonValue),attempts:Math.max(0,Math.floor(nval(data.attempts)))};if(this.editing){let idx=this.data.leads.findIndex(l=>l.id===this.editing);if(idx>=0)this.data.leads[idx]={...this.data.leads[idx],...obj}}else{if(this.data.leads.length>=500){alert('This edition supports 500 leads. Back up and remove old records to make room.');return}this.data.leads.push({id:guid(),...obj})}persist();nav('leads');showToast('Lead saved.')}if(form==='settings'){let s=this.data.settings;s.business=data.business.trim()||'My business';s.owners=data.owners.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,5);if(!s.owners.length)s.owners=['Owner'];for(let key of ['sources','statuses','lost']){let arr=data[key].split(/\n/).map(x=>x.trim()).filter(Boolean);if(arr.length)s[key]=[...new Set(arr)]}s.gaps=[data.g1,data.g2,data.g3].map(x=>Math.max(1,Math.floor(nval(x)||1)));persist();this.render();showToast('Settings saved.')}}};
