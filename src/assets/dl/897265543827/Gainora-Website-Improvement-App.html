'use strict';
const $=(q,root=document)=>root.querySelector(q);
const $$=(q,root=document)=>[...root.querySelectorAll(q)];
const E=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UK=(v)=>{if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T12:00:00');return Number.isNaN(d.valueOf())?'—':new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)};
const GBP=(n)=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);
const PCT=(n)=>((Number(n)||0)*100).toFixed(1)+'%';
const ISO=(d=new Date())=>{const t=new Date(d);return [t.getFullYear(),String(t.getMonth()+1).padStart(2,'0'),String(t.getDate()).padStart(2,'0')].join('-')};
const addDays=(iso,n)=>{if(!iso)return '';const d=new Date(String(iso).slice(0,10)+'T12:00:00');d.setDate(d.getDate()+Number(n));return ISO(d)};
const daysBetween=(a,b)=>{if(!a||!b)return null;const p=new Date(String(a).slice(0,10)+'T12:00:00'),q=new Date(String(b).slice(0,10)+'T12:00:00');return Math.round((q-p)/86400000)};
const nval=v=>{let n=Number(v);return Number.isFinite(n)?n:0};
const clone=x=>JSON.parse(JSON.stringify(x));
const guid=()=>{try{return crypto.randomUUID()}catch(e){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}};
function saveFile(filename,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
const saveText=(name,s,type='text/plain')=>saveFile(name,new Blob([s],{type:type+';charset=utf-8'}));
const csvField=(x)=>{let s=String(x??'');if(/^[\s]*[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
const csv=(rows)=>'\ufeff'+rows.map(r=>r.map(csvField).join(',')).join('\r\n');
const statusPill=(t,kind='')=>`<span class="pill ${E(kind)}">${E(t)}</span>`;
const opt=(arr,sel='',blank='Choose…')=>`<option value="">${E(blank)}</option>`+arr.map(s=>`<option value="${E(s)}" ${s===sel?'selected':''}>${E(s)}</option>`).join('');
const input=(label,key,value='',type='text',extras='')=>`<label class="field"><span>${E(label)}</span><input name="${E(key)}" type="${type}" value="${E(value)}" ${extras}></label>`;
const select=(label,key,values,current='',blank='Choose…')=>`<label class="field"><span>${E(label)}</span><select name="${E(key)}">${opt(values,current,blank)}</select></label>`;
const textarea=(label,key,value='')=>`<label class="field wide"><span>${E(label)}</span><textarea name="${E(key)}" rows="3">${E(value)}</textarea></label>`;
const box=(title,content,extras='')=>`<section class="panel ${extras}"><h2>${title}</h2>${content}</section>`;
const empty=(text)=>`<div class="empty"><div class="emptyIcon">◌</div><p>${E(text)}</p></div>`;
const btn=(action,text,cls='secondary',more='')=>`<button type="button" class="btn ${cls}" data-act="${E(action)}" ${more}>${E(text)}</button>`;
const table=(columns,rows)=>`<div class="tablewrap"><table><thead><tr>${columns.map(h=>`<th>${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
const kv=(name,value,note='')=>`<div class="kpi"><span class="kpiTitle">${E(name)}</span><strong>${value}</strong>${note?`<small>${E(note)}</small>`:''}</div>`;
const heading=(eyebrow,title,sub='',action='')=>`<div class="pagehead"><div><span class="eyebrow">${E(eyebrow)}</span><h1>${E(title)}</h1>${sub?`<p>${E(sub)}</p>`:''}</div>${action?`<div class="headActions">${action}</div>`:''}</div>`;
const notice=(txt,kind='info')=>`<div class="notice ${kind}">${E(txt)}</div>`;
const gauge=(name,value,max=100,tail='')=>`<div class="gaugeRow"><span>${E(name)}</span><div class="track"><div class="trackfill" style="width:${Math.min(100,Math.max(0,max?Number(value)/max*100:0))}%"></div></div><b>${E(tail||String(value))}</b></div>`;
const footer=()=>`<footer class="footer">© Gainora. Licensed for use in one business. Please don't resell or share the files. Questions: <a href="mailto:hello@gainora.co.uk">hello@gainora.co.uk</a>.</footer>`;
const KEY_PREFIX='gainora.browser.v1.';
function initialiseData(slug,make){try{const raw=localStorage.getItem(KEY_PREFIX+slug);if(raw){const d=JSON.parse(raw);if(d&&d.app===slug&&d.version===1)return d}}catch(e){console.warn('Storage unavailable',e)}return make()}
function persist(){try{localStorage.setItem(KEY_PREFIX+APP.slug,JSON.stringify(APP.data));const el=$('#saveStatus');if(el){el.textContent='Saved on this device';el.className='savestatus'}}catch(e){const el=$('#saveStatus');if(el){el.textContent='Storage unavailable — export a backup';el.className='savestatus alert'}showToast('Browser storage unavailable. Export a backup before closing.')}}
function showToast(s){const e=$('#toast');if(!e)return;e.textContent=s;e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),4000)}
function backup(){saveText('Gainora-'+APP.slug+'-Backup-'+ISO()+'.json',JSON.stringify(APP.data,null,2),'application/json');showToast('Backup downloaded. Keep it somewhere safe.')}
function restore(){const f=$('#restoreFile');f.value='';f.click()}
function onRestore(e){const f=e.target.files[0];if(!f)return;if(!confirm('Replace all current data with the selected backup? Export your current data first if needed.'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!==APP.slug||d.version!==1)throw Error('This file is not a matching Gainora backup.');APP.data=d;persist();APP.page='home';APP.render();showToast('Backup restored.')}catch(ex){alert('Could not restore backup: '+ex.message)}};r.readAsText(f)}
function nav(p){APP.page=p;APP.render();window.scrollTo(0,0)}
function appShell(){return `<div class="shell"><aside class="sidebar"><div class="brand"><img src="data:image/png;base64,${LOGO_B64}" alt="Gainora logo"><small>${E(APP.product)}</small></div><div class="navlabel">WORKSPACE</div><nav>${APP.nav.map(([p,l,i])=>`<button class="navbtn ${APP.page===p?'active':''}" data-nav="${E(p)}"><span class="navicon">${i}</span>${E(l)}</button>`).join('')}</nav><div class="sidebarBottom"><strong>Private by design</strong><p>Works offline. Your records stay in this browser unless you export them.</p><p class="tiny">Back up your data regularly.</p></div></aside><div class="mainArea"><header class="topbar"><button class="mobilebrand" data-nav="home"><img src="data:image/png;base64,${LOGO_B64}" alt="Gainora"></button><span class="topname">${E(APP.product)}</span><div class="topright"><span id="saveStatus" class="savestatus">Saved on this device</span>${btn('backup','↓ Backup','outline')}</div></header><main class="content" id="content"></main>${footer()}</div></div><input id="restoreFile" type="file" accept=".json,application/json" hidden><div id="toast" role="status" class="toast"></div>`}
function init(){APP.data=initialiseData(APP.slug,APP.initial);document.body.innerHTML=appShell();try{const k=KEY_PREFIX+'storage-check';localStorage.setItem(k,'1');if(localStorage.getItem(k)!=='1')throw Error('Storage write unavailable');localStorage.removeItem(k)}catch(ex){let el=$('#saveStatus');el.textContent='Storage unavailable — export backups';el.className='savestatus alert';showToast('This browser does not permit local saving here. Export a JSON backup after every session.')}$('#restoreFile').addEventListener('change',onRestore);document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){nav(navEl.dataset.nav);return}const actEl=e.target.closest('[data-act]');if(actEl){const act=actEl.dataset.act;if(act==='backup')return backup();if(act==='restore')return restore();APP.action(act,actEl)}});document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();APP.submit(f.dataset.form,Object.fromEntries(new FormData(f)))}});APP.render();}

let CHECKS=AREAS.flatMap((area,a)=>area.checks.map((q,i)=>({id:'W'+String(a+1).padStart(2,'0')+String(i+1).padStart(2,'0'),area:area.name,areaIdx:a,question:q[0],test:q[1],fix:q[2],impact:q[3],effort:q[4]})));
const APP={slug:'Website-Improvement-Toolkit',product:'Website Improvement Toolkit',page:'home',areaFilter:'All',nav:[['home','Overview','▦'],['review','Website review','☑'],['scores','Your scores','▥'],['priorities','Fix priorities','★'],['plan','30-day fix plan','▤'],['notes','Journey test','◷'],['settings','Settings & backup','⚙'],['guide','How to use','?']],
initial(){return {app:'Website-Improvement-Toolkit',version:1,profile:{business:'',url:'',action:'',audience:'',reviewDate:ISO(),reviewedBy:''},answers:{},plan:{},journey:{name:'',task:'',date:'',steps:'',stuck:'',comments:'',questions:''},notes:''}},
ans(id){return this.data.answers[id]||{}},
score(area=null){let checks=CHECKS.filter(c=>area===null||c.area===area),scored=0,max=0,answered=0;for(let c of checks){let a=this.ans(c.id);if(a.result){answered++;if(a.result!=='Not applicable'){max+=2;scored+=a.result==='Yes'?2:a.result==='Partly'?1:0}}}return {scored,max,answered,all:checks.length,pct:max?Math.round(scored/max*100):null}},
priority(c){let a=this.ans(c.id),impact=a.impact||c.impact,effort=a.effort||c.effort;return ({High:3,Medium:2,Low:1}[impact]||1)*({'Quick (under 1 hour)':3,'Medium (a day)':2,'Big (needs help)':1,Quick:3,Medium:2,Big:1}[effort]||1)},
fixes(){return CHECKS.filter(c=>['No','Partly'].includes(this.ans(c.id).result)).sort((a,b)=>this.priority(b)-this.priority(a)||a.id.localeCompare(b.id))},
render(){const c=$('#content');c.innerHTML=({home:()=>this.home(),review:()=>this.review(),scores:()=>this.scores(),priorities:()=>this.priorities(),plan:()=>this.plan(),notes:()=>this.notes(),settings:()=>this.settings(),guide:()=>this.guide()})[this.page]?.()||''},
home(){let s=this.score(),issues=this.fixes(),hi=issues.filter(c=>this.priority(c)>=9);return heading('GAINORA WEBSITE AUDIT','A clearer website starts here.','Review seven key areas, score your site and plan the fixes that matter.',btn('goReview','Start the review','primary'))+`<div class="grid">${kv('Overall reviewed score',s.pct===null?'—':s.pct+'%','Not applicable excluded')}${kv('Checks reviewed',`${s.answered} / ${s.all}`,'45 checks across 7 areas')}${kv('Fixes identified',issues.length,'No and Partly answers')}${kv('Top quick wins',hi.length,'High impact, quick effort')}</div><div class="split">${box('Seven review areas',AREAS.map(a=>{let q=this.score(a.name);return gauge(a.name,q.pct||0,100,q.pct===null?'—':q.pct+'%')}).join(''))}${box('Review rhythm',`<ol><li>Write down your website’s one main job.</li><li>Review on a phone first, then on a computer.</li><li>Mark each check: Yes, Partly, No or Not applicable.</li><li>Open priorities for quick wins.</li><li>Set owners and deadlines in your fix plan.</li><li>Re-review 30 days later.</li></ol>${btn('goPriorities','See priorities','secondary')}`)}</div>`},
review(){let fl=this.areaFilter,arr=CHECKS.filter(x=>fl==='All'||x.area===fl);return heading('45-POINT REVIEW','Review your website.','Mark what you find. Unanswered checks are excluded from the score until reviewed.',btn('goScores','See live scores','outline'))+`<div class="toolbar"><label class="field"><span>Review area</span><select id="areaFilter"><option ${fl==='All'?'selected':''}>All</option>${AREAS.map(a=>`<option ${fl===a.name?'selected':''}>${E(a.name)}</option>`).join('')}</select></label><span class="spacer"></span>${btn('print','Print review','outline')}</div>${arr.map(c=>{let a=this.ans(c.id);return `<section class="card" style="margin-bottom:10px"><div class="profile"><div><span class="eyebrow">${E(c.area)} · ${E(c.id)}</span><h3 style="font-size:16px;margin:5px 0">${E(c.question)}</h3></div>${statusPill(a.result||'Not reviewed',a.result==='No'?'red':a.result==='Yes'?'green':'')}</div><p class="subtle"><b>Try this:</b> ${E(c.test)}</p><div class="formgrid"><label class="field"><span>Result</span><select data-check="${c.id}" data-key="result">${opt(['Yes','Partly','No','Not applicable'],a.result,'Not reviewed')}</select></label><label class="field"><span>Impact</span><select data-check="${c.id}" data-key="impact">${opt(['High','Medium','Low'],a.impact||c.impact,'Impact')}</select></label><label class="field"><span>Effort</span><select data-check="${c.id}" data-key="effort">${opt(['Quick (under 1 hour)','Medium (a day)','Big (needs help)'],a.effort||c.effort,'Effort')}</select></label><label class="field wide"><span>Notes</span><input data-check="${c.id}" data-key="notes" value="${E(a.notes||'')}" placeholder="What did you notice?" maxlength="400"></label></div></section>`}).join('')}`},
scores(){let score=this.score();return heading('YOUR AUDIT RESULTS','Your scores, in one view.','Yes = 2, Partly = 1, No = 0. Not applicable is excluded. Unanswered checks are not scored.')+`<div class="grid three">${kv('Overall score',score.pct===null?'—':score.pct+'%',`${score.answered} / ${score.all} checks reviewed`)}${kv('Fix opportunities',this.fixes().length,'No or Partly responses')}${kv('Review coverage',Math.round(score.answered/score.all*100)+'%','Of all review checks')}</div>${box('Score by area',AREAS.map(a=>{let s=this.score(a.name);return `<div class="profile" style="margin-top:14px"><b>${E(a.name)}</b><span class="subtle">${s.answered}/${s.all} reviewed</span></div>${gauge('',s.pct||0,100,s.pct===null?'—':s.pct+'%')}`}).join(''))}${notice('Scores reflect the checks you have answered. A high score does not guarantee better rankings, enquiries or sales.')}`},
priorities(){let f=this.fixes();return heading('WORK THROUGH WHAT MATTERS','Your improvement priorities.','High impact and quick fixes rise to the top (impact × effort).',btn('goPlan','Open fix plan','primary'))+box('Ranked fixes',f.length?table(['Priority','Area','Fix to make','Result','Impact / effort',''],f.map(c=>{let a=this.ans(c.id),s=this.priority(c);return `<tr><td>${statusPill(String(s),s>=9?'green':'')}</td><td>${E(c.area)}</td><td><b>${E(c.fix)}</b><small>${E(c.question)}</small></td><td>${statusPill(a.result,a.result==='No'?'red':'amber')}</td><td>${E(a.impact||c.impact)} / ${E(a.effort||c.effort)}</td><td>${btn('goPlan','Plan','outline')}</td></tr>`})):empty('No fixes identified yet. Complete the review to create your priority list.'))},
plan(){let f=this.fixes(),date=this.data.profile.reviewDate||ISO();return heading('TAKE ACTION','Your 30-day fix plan.','Assign each fix, give it a sensible deadline and record when it is done.',btn('print','Print plan','outline'))+`${notice('First review: '+UK(date)+' · Suggested re-review: '+UK(addDays(date,30)))}${box('Open and completed fixes',f.length?`<div class="stack">${f.map(c=>{let p=this.data.plan[c.id]||{};return `<div class="card"><div class="profile"><div><span class="eyebrow">${E(c.area)} · PRIORITY ${this.priority(c)}</span><h3>${E(c.fix)}</h3></div>${statusPill(p.status||'Not started',p.status==='Done'?'green':'')}</div><p class="subtle">${E(c.question)}</p><div class="formgrid"><label class="field"><span>Owner</span><input data-plan="${c.id}" data-key="owner" value="${E(p.owner||'')}" placeholder="Name"></label><label class="field"><span>Deadline</span><input type="date" data-plan="${c.id}" data-key="deadline" value="${E(p.deadline||'')}"></label><label class="field"><span>Status</span><select data-plan="${c.id}" data-key="status">${opt(['Not started','In progress','Done'],p.status||'Not started','Status')}</select></label><label class="field"><span>Date done</span><input type="date" data-plan="${c.id}" data-key="done" value="${E(p.done||'')}"></label><label class="field half"><span>Notes / evidence</span><input data-plan="${c.id}" data-key="notes" value="${E(p.notes||'')}" placeholder="What changed?"></label></div></div>`}).join('')}</div>`:empty('Complete the website review first. No/Partly answers appear here automatically.'))}${notice('Marking a fix Done does not automatically change the review score. Re-test the site and update the relevant Review answer.')}`},
notes(){let j=this.data.journey;return heading('CUSTOMER JOURNEY TEST','Watch someone use your site.','Ask a friend to complete one real task while you observe quietly.')+`<form data-form="journey" class="panel"><div class="formgrid">${input('Observer / tester','name',j.name)}${input('Test date','date',j.date,'date')}${input('Task to attempt','task',j.task)}${textarea('Steps they took','steps',j.steps)}${textarea('Where they got stuck','stuck',j.stuck)}${textarea('What they said','comments',j.comments)}${textarea('Three questions customers ask most','questions',j.questions)}</div><div class="formButtons"><button class="btn primary" type="submit">Save observations</button>${btn('print','Print worksheet','outline')}</div></form>${box('How to conduct the test',`<ol><li>Write one task: “Find the price of [service] and enquire.”</li><li>Give your friend the website URL and ask them to talk aloud.</li><li>Observe without coaching them.</li><li>Record confusing steps, wrong taps and questions.</li><li>Turn the obstacles into review notes and your fix plan.</li></ol>`)}`},
settings(){let p=this.data.profile;return heading('YOUR REVIEW','Set up your audit.','These details appear in your saved review and 30-day re-review date.')+`<form data-form="profile" class="panel"><div class="formgrid">${input('Business / website name','business',p.business)}${input('Website URL','url',p.url,'url','placeholder="https://example.co.uk"')}${input('Date of first review','reviewDate',p.reviewDate,'date')}${input('Main action you want visitors to take','action',p.action)}${input('Ideal customer','audience',p.audience)}${input('Reviewer','reviewedBy',p.reviewedBy)}</div><div class="formButtons"><button type="submit" class="btn primary">Save review details</button></div></form>${box('Export, restore and practise',`<p>Your answers are stored only in this browser. Export a backup to retain them or move to another device.</p><div class="toolbar">${btn('backup','Download JSON backup','primary')}${btn('restore','Restore backup','outline')}${btn('csv','Export review CSV','outline')}${btn('example','Load fictional plumber example','outline')}${btn('reset','Clear the audit','danger')}</div>${notice('Restoring a backup overwrites this audit. Keep customer and business details private.','warn')}`)}`},
guide(){return heading('YOUR 90-MINUTE WEBSITE REVIEW','How to use your Gainora toolkit.','You can review any website platform, including Wix, Squarespace, Shopify and WordPress.')+`<div class="panel guide"><div class="guideblock"><h3>10-minute setup</h3><ol><li>Under Settings, enter your business, URL, main action and ideal customer.</li><li>Open your website on a phone first, then on a computer. Use the same browser for your notes.</li><li>Keep this app in another tab so you can record answers.</li></ol></div><div class="guideblock"><h3>Seven review areas</h3>${AREAS.map(a=>`<p><b>${E(a.name)}:</b> ${E(a.why)}</p>`).join('')}</div><div class="guideblock"><h3>How scoring works</h3><p>Yes earns 2 points, Partly earns 1 and No earns 0. Not applicable is excluded from scoring. Unanswered items do not count yet. Priorities use impact High=3 / Medium=2 / Low=1 multiplied by effort Quick=3 / Medium=2 / Big=1.</p></div><div class="guideblock"><h3>30-day improvement cycle</h3><p>Run a customer journey test: watch someone try to book, buy or enquire without coaching. Start with high-impact quick wins. Assign each fix to someone with a deadline. After 30 days, re-test and update review results. Ask for professional help when a change involves security, payments or code you do not understand.</p></div><div class="guideblock"><h3>FAQ & troubleshooting</h3><p><b>Does the app scan my site automatically?</b> No. You perform the checks and record answers. This avoids guessing what visitors experience.</p><p><b>Do I need paid tools?</b> No. The app and browser tools are free. Google’s free PageSpeed Insights can help with speed checks; internet is required to use that external service.</p><p><b>Does my score promise more sales?</b> No. It helps you organise observations and fixes.</p><p><b>Can staff collaborate live?</b> Not in the offline version. Agree a single person to maintain the master copy and export backups.</p><p><b>Does it save automatically?</b> Yes, in this browser, but data can be removed if browser storage is cleared. Download backups regularly.</p></div><div class="callout">If you’d like a second pair of eyes, Gainora offers a business diagnosis. Support: hello@gainora.co.uk.</div></div>`},
action(a){if(a==='goReview')return nav('review');if(a==='goScores')return nav('scores');if(a==='goPriorities')return nav('priorities');if(a==='goPlan')return nav('plan');if(a==='print')return window.print();if(a==='csv')return saveText('Gainora-Website-Review-'+ISO()+'.csv',csv([['ID','Area','Check','Test','Result','Impact','Effort','Notes','Fix','Priority','Fix status','Owner','Deadline','Done date'],...CHECKS.map(c=>{let a=this.ans(c.id),p=this.data.plan[c.id]||{};return [c.id,c.area,c.question,c.test,a.result||'',a.impact||c.impact,a.effort||c.effort,a.notes||'',c.fix,this.priority(c),p.status||'',p.owner||'',p.deadline||'',p.done||'']})]),'text/csv');if(a==='example'){if((Object.keys(this.data.answers).length||[this.data.profile.business,this.data.profile.url,this.data.profile.action].some(v=>v))&&!confirm('Replace your current review with the fictional Henley Plumbing & Heating example? Export a backup first.'))return;this.data=this.initial();this.data.profile={business:'Henley Plumbing & Heating — FICTIONAL EXAMPLE',url:'https://example.invalid',action:'Request a quote',audience:'Homeowners in Henley',reviewDate:ISO(),reviewedBy:'Example reviewer'};for(let i=0;i<CHECKS.length;i++){let c=CHECKS[i];this.data.answers[c.id]={result:i%9===0?'No':i%4===0?'Partly':i%17===0?'Not applicable':'Yes',notes:i%9===0?'Example: could not find this on the fictional website.':''}}persist();this.render();showToast('Fictional example loaded. Clear it before entering real findings.')}if(a==='reset'){if(confirm('Clear this entire review and fix plan? Download a backup first.')){this.data=this.initial();persist();nav('home')}}},
submit(a,d){if(a==='profile'){this.data.profile={...d};persist();this.render();showToast('Review details saved.')}if(a==='journey'){this.data.journey={...d};persist();this.render();showToast('Journey observations saved.')}}};
init();
document.addEventListener('change',e=>{if(e.target.id==='areaFilter'){APP.areaFilter=e.target.value;APP.render();return}let ch=e.target.dataset.check,key=e.target.dataset.key;if(ch){if(!APP.data.answers[ch])APP.data.answers[ch]={};APP.data.answers[ch][key]=e.target.value;persist();if(key!=='notes')APP.render();return}let p=e.target.dataset.plan;if(p){if(!APP.data.plan[p])APP.data.plan[p]={};APP.data.plan[p][key]=e.target.value;persist();if(key==='status')APP.render()}});
</script></body></html>
