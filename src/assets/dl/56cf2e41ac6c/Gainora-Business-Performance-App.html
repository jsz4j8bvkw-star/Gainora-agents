const KEY_PREFIX='gainora.browser.v1.';

function backup(){saveText('Gainora-'+APP.slug+'-Backup-'+ISO()+'.json',JSON.stringify(APP.data,null,2),'application/json');showToast('Backup downloaded. Keep it somewhere safe.')}

function onRestore(e){const f=e.target.files[0];if(!f)return;if(!confirm('Replace all current data with the selected backup? Export your current data first if needed.'))return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!==APP.slug||d.version!==1)throw Error('This file is not a matching Gainora backup.');APP.data=d;persist();APP.page='home';APP.render();showToast('Backup restored.')}catch(ex){alert('Could not restore backup: '+ex.message)}};r.readAsText(f)}

function init(){APP.data=initialiseData(APP.slug,APP.initial);document.body.innerHTML=appShell();try{const k=KEY_PREFIX+'storage-check';localStorage.setItem(k,'1');if(localStorage.getItem(k)!=='1')throw Error('Storage write unavailable');localStorage.removeItem(k)}catch(ex){let el=$('#saveStatus');el.textContent='Storage unavailable — export backups';el.className='savestatus alert';showToast('This browser does not permit local saving here. Export a JSON backup after every session.')}$('#restoreFile').addEventListener('change',onRestore);document.addEventListener('click',e=>{const navEl=e.target.closest('[data-nav]');if(navEl){nav(navEl.dataset.nav);return}const actEl=e.target.closest('[data-act]');if(actEl){const act=actEl.dataset.act;if(act==='backup')return backup();if(act==='restore')return restore();APP.action(act,actEl)}});document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(f){e.preventDefault();APP.submit(f.dataset.form,Object.fromEntries(new FormData(f)))}});APP.render();}

initial(){return {app:'Business-Performance-Dashboard',version:1,settings:{business:'My business',startYear:new Date().getFullYear(),startMonth:1,vat:'No',revenue:REV,costs:COSTS,targets:{revenue:0,margin:20,customers:0,leads:0}},months:Array.from({length:12},()=>({revenue:Array(4).fill(''),costs:Array(11).fill(''),orders:'',customers:'',leads:'',visits:'',cash:'',debtors:'',creditors:'',hours:'',entered:false}))}},

comparison(current,previous,target,kind='money'){let fmt=v=>kind==='money'?GBP(v):kind==='percent'?PCT(v):String(v);if(previous===null||previous===undefined)return 'Previous month: no data';let change=current-previous,dir=change>0?'▲':change<0?'▼':'—';let pct=previous?` (${change>=0?'+':''}${PCT(change/Math.abs(previous))})`:'';let targetText=target===null||target===undefined||!Number(target)?'':` · target ${fmt(target)} ${current>=target?'✓':'•'}`;return `${dir} ${fmt(Math.abs(change))}${pct} vs previous${targetText}`},

nd(n*100)},'%',100))}${box('Cash trend',this.bars('Cash',i=>this.calc(i).cash,'£'))}${box('Leads vs new customers',this.twoSeries('Leads','Customers',i=>this.calc(i).leads,i=>this.calc(i).customers))}</div>${box('Cost breakdown · '+this.monthName(this.selected),this.data.settings.costs.map((label,i)=>({label,val:nval(this.data.months[this.selected].costs[i])})).filter(x=>x.val>0).map(x=>gauge(x.label,x.val,Math.max(1,...this.data.months[this.selected].costs.map(nval)),GBP(x.val))).join('')||empty('No costs entered.'))}${this.overviewNotes()}`},

bars(title,get,unit='',fixedMax=0){let values=this.data.months.map((m,i)=>m.entered?Math.max(0,nval(get(i))):0);let max=fixedMax||Math.max(1,...values);return `<div class="chart" role="img" aria-label="${E(title)} chart">${values.map((val,i)=>`<div class="chartcol"><span class="chartval">${this.data.months[i].entered?E(unit==='£'?Math.round(val).toLocaleString('en-GB'):val+unit):''}</span><div class="chartbar" style="height:${Math.max(1,val/max*136)}px"></div><span class="chartlabel">${E(this.monthName(i).split(' ')[0])}</span></div>`).join('')}</div>`},
twoSeries(a,b,fnA,fnB){let vs=this.data.months.map((m,i)=>m.entered?[nval(fnA(i)),nval(fnB(i))]:[0,0]),max=Math.max(1,...vs.flat());return `<div class="chart" role="img" aria-label="${E(a)} compared with ${E(b)}"><div style="display:flex;align-items:end;width:100%;height:150px;gap:7px">${vs.map(([x,y],i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center"><div style="height:125px;display:flex;gap:2px;align-items:end;width:100%;justify-content:center"><div class="chartbar" title="${E(a)}: ${x}" style="height:${Math.max(2,x/max*120)}px;width:42%"></div><div class="chartbar alt" title="${E(b)}: ${y}" style="height:${Math.max(2,y/max*120)}px;width:42%"></div></div><span class="chartlabel">${E(this.monthName(i).split(' ')[0])}</span></div>`).join('')}</div></div><div class="legend"><span><i class="dot"></i>${E(a)}</span><span><i class="dot alt"></i>${E(b)}</span></div>`},
monthly(){let m=this.data.months[this.selected],s=this.data.settings;return heading('MONTHLY INPUT','Enter the numbers that matter.','A short monthly update is enough to keep your management view useful.',btn('goHome','See dashboard','outline'))+`<div class="toolbar">${this.monthSelect()} ${btn('saveMonth','Save month','primary',`data-form-save="month"`)}</div><form data-form="month" id="monthForm">${notice(`You are editing ${this.monthName(this.selected)}. ${s.vat==='Yes'?'You are VAT-registered: enter revenue and costs excluding VAT.':'Check you use a consistent VAT basis for figures.'}`)}<div class="split equal">${box('Revenue by category',`<div class="stack">${s.revenue.map((cat,i)=>input(cat,'r'+i,m.revenue[i],'number','min="0" step="0.01"')).join('')}</div>`)}${box('Costs by category',`<div class="stack">${s.costs.map((cat,i)=>input(cat,'c'+i,m.costs[i],'number','min="0" step="0.01"')).join('')}</div>`)}</div>${box('Activity and cash position',`<div class="formgrid">${METRICS.map(([key,label])=>input(label,key,m[key],'number','min="0" step="0.01"')).join('')}</div><div class="formButtons"><button class="btn primary" type="submit">Save figures for ${E(this.monthName(this.selected))}</button>${btn('clearMonth','Clear this month','danger')}</div>`)}</form>`},
year(){let vals=this.data.months.map((_,i)=>this.calc(i)),any=vals.some(x=>x.entered);let totals={revenue:vals.reduce((a,c)=>a+c.revenue,0),cost:vals.reduce((a,c)=>a+c.cost,0),profit:vals.reduce((a,c)=>a+c.profit,0),customers:vals.reduce((a,c)=>a+c.customers,0),leads:vals.reduce((a,c)=>a+c.leads,0)};let entered=vals.filter(v=>v.entered),best=entered.length?entered.reduce((a,b)=>a.profit>=b.profit?a:b).profit:null,worst=entered.length?entered.reduce((a,b)=>a.profit<=b.profit?a:b).profit:null;return heading('FULL YEAR','Your 12-month summary.','Compare entered months; empty months are not assumed to have zero activity.',btn('print','Print summary','outline'))+(any?`<div class="grid">${kv('Year-to-date revenue',GBP(totals.revenue))}${kv('Year-to-date costs',GBP(totals.cost))}${kv('Year-to-date profit',GBP(totals.profit))}${kv('New customers / leads',totals.customers+' / '+totals.leads)}</div>`:'')+box('12-month performance',any?table(['Month','Revenue','Costs','Profit','Margin','Sales','Customers','Leads','Cash'],vals.map((v,i)=>`<tr><td>${E(this.monthName(i))}</td>${v.entered?`<td>${GBP(v.revenue)}</td><td>${GBP(v.cost)}</td><td class="${v.profit===best?'greenText':v.profit===worst?'dangertext':''}">${GBP(v.profit)}</td><td>${v.margin===null?'—':PCT(v.margin)}</td><td>${v.orders}</td><td>${v.customers}</td><td>${v.leads}</td><td>${GBP(v.cash)}</td>`:`<td colspan="8" class="muted">Not entered</td>`}</tr>`)):empty('Enter monthly figures to see the year summary.'))},
health(){let i=this.selected,c=this.calc(i),p=i>0?this.calc(i-1):null,pp=i>1?this.calc(i-2):null,t=this.data.settings.targets,flags=[];if(!c.entered)return heading('EARLY INDICATORS','Your business health check.','Flags use your figures only. They are things to review, not predictions.')+`<div class="toolbar">${this.monthSelect()}</div>`+empty('Enter figures for this month first.');if(p?.entered&&p.revenue>0&&p.cost>0&&c.cost/p.cost>c.revenue/p.revenue)flags.push(['Costs rose faster than revenue','Compare changes in staff, materials and overheads against revenue.']);if(c.margin!==null&&c.margin<t.margin/100)flags.push(['Profit margin is below your target','Review costs, pricing and any unusual expenditure.']);let avg=this.data.months.filter(m=>m.entered).reduce((a,m)=>a+m.costs.reduce((b,x)=>b+nval(x),0),0)/Math.max(1,this.data.months.filter(m=>m.entered).length);if(c.cash<avg)flags.push(['Cash is below one average month of costs','Review upcoming payments, outstanding invoices and your cash needs.']);if(p?.entered&&pp?.entered&&c.debtors>p.debtors&&p.debtors>pp.debtors)flags.push(['Money owed to you rose for two months','Look at unpaid invoices and your normal payment reminders.']);if(p?.entered&&c.CPA!==null&&p.CPA!==null&&c.CPA>p.CPA)flags.push(['Marketing cost per new customer increased','Compare marketing spend and new-customer numbers across months.']);return heading('EARLY INDICATORS','What deserves a closer look?','Based on your own figures; check the underlying records before taking action.')+`<div class="toolbar">${this.monthSelect()}</div>${box('Health check · '+this.monthName(i),flags.length?flags.map(([h,b])=>`<div class="card" style="margin-bottom:12px"><h3>Review: ${E(h)}</h3><p>${E(b)}</p></div>`).join(''):notice('No listed warning thresholds were triggered for the available entered figures. This is not a guarantee that everything is fine.'))}${this.overviewNotes()}`},
settings(){let s=this.data.settings;return heading('PREFERENCES','Set up your business.','Choose your financial-year start and rename categories to match your records.')+`<form data-form="settings" class="panel"><div class="formgrid">${input('Business name','business',s.business)}${input('Financial year start year','startYear',s.startYear,'number','min="2000" max="2100"')}${select('Financial year start month','startMonth',Array.from({length:12},(_,i)=>String(i+1)),String(s.startMonth),'Start month')}${select('VAT registered?','vat',['Yes','No'],s.vat)}${input('Monthly revenue target (£)','tRevenue',s.targets.revenue,'number','min="0" step="0.01"')}${input('Target profit margin (%)','tMargin',s.targets.margin,'number','min="-100" max="100" step="0.1"')}${input('Monthly new-customer target','tCustomers',s.targets.customers,'number','min="0"')}${input('Monthly lead target','tLeads',s.targets.leads,'number','min="0"')}${textarea('Revenue categories — one per line, up to 8','revenue',s.revenue.join('\n'))}${textarea('Cost categories — one per line','costs',s.costs.join('\n'))}</div>${notice('Changing the financial-year start relabels the existing 12 monthly data slots. Changing category order also changes their labels. Back up first.','warn')}<div class="formButtons"><button type="submit" class="btn primary">Save settings</button></div></form>${box('Backups and examples',`<p>All figures remain in this browser. They are not uploaded to Gainora or synced with other devices.</p><div class="toolbar">${btn('backup','Download JSON backup','primary')}${btn('restore','Restore a backup','outline')}${btn('csv','Export 12-month CSV','outline')}${btn('demo','Load fictional café figures','outline')}${btn('clear','Clear all 12 months','danger')}</div>${notice('A restore replaces your current work. Save a dated backup before using another device.','warn')}`)}`},
guide(){return heading('START HERE','Your 20-minute monthly routine.','One clear management view without needing accounting software.')+`<div class="panel guide"><div class="guideblock"><h3>10-minute setup</h3><ol><li>Open Settings and enter the business name, financial year start month and VAT registration status.</li><li>Rename the revenue and cost categories if needed. Choose monthly targets based on your own recent figures.</li><li>Open Monthly input, select a month, enter your totals and save.</li></ol></div><div class="guideblock"><h3>Monthly 20-minute routine</h3><ol><li>Gather figures from your bank, till, payment processor and accounting records.</li><li>Enter monthly revenue and costs. Use figures excluding VAT if VAT-registered.</li><li>Enter orders, new customers, enquiries, cash, unpaid invoices and owner hours if known.</li><li>Read Dashboard, check last month and your targets, then review the Health check.</li><li>Download a JSON backup every month.</li></ol></div><div class="guideblock"><h3>Three questions worth asking</h3><p>Did revenue grow without costs growing faster? Which expense or customer number moved most? Is cash sufficient for upcoming bills?</p></div><div class="guideblock"><h3>Understanding the figures</h3><p>Profit = revenue minus the costs you entered. Margin = profit divided by revenue. Average sale = revenue divided by orders. Lead-to-customer % = new customers divided by enquiries; it is indicative, as those groups may not be the same people. Owner profit per hour = profit divided by the hours you entered, not salary.</p></div><div class="guideblock"><h3>FAQ & troubleshooting</h3><p><b>What if I have not entered every month?</b> Empty months are shown as missing; no figures are invented.</p><p><b>Do my figures sync?</b> No, this is a private offline app. Save and restore JSON backups to move devices.</p><p><b>Is this bookkeeping or tax advice?</b> No. This is a management tool; your accountant’s figures take priority.</p><p><b>Can I use figures from my till or invoices?</b> Yes, but keep the basis consistent and use one period per month.</p></div><div class="callout">Support: hello@gainora.co.uk · Gainora does not have access to your locally saved figures.</div></div>`},
action(a){if(a==='goMonth')return nav('monthly');if(a==='goHome')return nav('home');if(a==='print')return window.print();if(a==='saveMonth')return $('#monthForm')?.requestSubmit();if(a==='csv')return saveText('Gainora-Performance-12-Months-'+ISO()+'.csv',csv([['Month','Revenue','Costs','Profit','Margin','Orders','Customers','Leads','Visits','Cash','Debtors','Creditors','Owner hours'],...this.data.months.map((m,i)=>{let c=this.calc(i);return [this.monthName(i),c.entered?c.revenue:'',c.entered?c.cost:'',c.entered?c.profit:'',c.entered&&c.margin!==null?c.margin:'',m.orders,m.customers,m.leads,m.visits,m.cash,m.debtors,m.creditors,m.hours]})]),'text/csv');if(a==='clearMonth'){if(confirm('Clear the figures for this month?')){this.data.months[this.selected]=this.initial().months[0];persist();this.render()}}if(a==='clear'){if(confirm('Clear all 12 months of figures? Download a backup first.')){this.data.months=this.initial().months;persist();this.render()}}if(a==='demo'){if(this.data.months.some(m=>m.entered)&&!confirm('Replace all current monthly figures with fictional café data? Download a backup first.'))return;let blank=this.initial().months;this.data.months=blank.map((m,i)=>({...m,entered:true,revenue:this.data.settings.revenue.map((_,j)=>j===0?Math.round(11000+2600*Math.cos(i*Math.PI/6)+i*110):j===1?2400+i*80:j===2?1900+i*70:0),costs:this.data.settings.costs.map((x,j)=>{let vals=[4200,3200,1550,550,480,160,155,190,110,130,150];return j<vals.length?vals[j]+Math.round(i*j*3):60}),orders:230+i*4,customers:26+(i%5),leads:47+(i%7)*3,visits:1250+i*70,cash:13000+i*190,debtors:2100+i*60,creditors:1500+i*30,hours:125+i*3}));persist();this.render();showToast('Fictional Corner Café, York data loaded. Replace before real use.')}} ,
submit(form,d){if(form==='month'){let m=this.data.months[this.selected];m.revenue=this.data.settings.revenue.map((_,i)=>d['r'+i]||'');m.costs=this.data.settings.costs.map((_,i)=>d['c'+i]||'');for(let [k] of METRICS)m[k]=d[k]||'';m.entered=true;persist();nav('home');showToast('Monthly figures saved.')}if(form==='settings'){let s=this.data.settings;let rev=d.revenue.split(/\n/).map(x=>x.trim()).filter(Boolean).slice(0,8),cost=d.costs.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!rev.length||!cost.length)return alert('Add at least one revenue and one cost category.');s.business=d.business.trim()||'My business';s.startYear=Math.min(2100,Math.max(2000,Math.round(nval(d.startYear))));s.startMonth=Math.min(12,Math.max(1,Math.round(nval(d.startMonth))));s.vat=d.vat;s.revenue=rev;s.costs=cost;s.targets={revenue:nval(d.tRevenue),margin:nval(d.tMargin),customers:nval(d.tCustomers),leads:nval(d.tLeads)};for(let m of this.data.months){while(m.revenue.length<rev.length)m.revenue.push('');m.revenue.length=rev.length;while(m.costs.length<cost.length)m.costs.push('');m.costs.length=cost.length}persist();this.render();showToast('Settings saved.')}}};
init();
document.addEventListener('change',e=>{if(e.target.id==='selectedMonth'){APP.selected=+e.target.value;APP.render()}});
</script></body></html>
