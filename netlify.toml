# Gainora Agents — app.gainora.co.uk
[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

# The Supabase address and publishable key are public by design: they're built into the app
# so the browser can sign in. Tell Netlify's secret scan not to treat them as leaked secrets.
# The service role key, Claude key and internal secret are never in the app, only in functions.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,APP_URL,EMAIL_FROM"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The app itself stays out of Google (index.html also says noindex). The clients' websites, served by
# netlify/functions/site-serve.ts, set their own headers so Google can index them.
[[headers]]
  for = "/index.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# Clients' own domains are routed to their websites by netlify/edge-functions/sites.ts (its config says where it runs).

# Gainora's admin at app.gainora.co.uk/admin: its pages (/admin, /admin/clients, …) all serve the admin app,
# so refreshing an admin page keeps you in the admin. (admin.gainora.co.uk is handled by the edge function.)
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

# Single-page app: every route serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
