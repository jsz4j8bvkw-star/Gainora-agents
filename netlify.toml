  from = "/requests"
  to = "/admin/requests"
  status = 301

[[redirects]]
  from = "/requests/*"
  to = "/admin/requests/:splat"
  status = 301

[[redirects]]
  from = "/health"
  to = "/admin/health"
  status = 301

[[redirects]]
  from = "/health/*"
  to = "/admin/health/:splat"
  status = 301

[[redirects]]
  from = "/money"
